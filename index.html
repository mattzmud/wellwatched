<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F6F0">
<title>WellWatched</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F6F0;
    --card: #FFFFFF;
    --green: #4CAF50;
    --green-dark: #3E8E41;
    --purple: #7C3AED;
    --text: #1A1A2E;
    --muted: #6B7280;
    --border: #E5E0D8;
    --danger: #C0392B;
    --r-card: 16px;
    --r-input: 8px;
    --r-modal: 24px;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .brand, label, .btn, .tab-label {
    font-family: 'Nunito', system-ui, sans-serif;
  }
  h1 { font-size: 1.75rem; font-weight: 800; margin: 0 0 4px; }
  h2 { font-size: 1.25rem; font-weight: 800; margin: 0 0 12px; }
  h3 { font-size: 1rem; font-weight: 700; margin: 0; }
  p { margin: 0 0 12px; }
  a { color: var(--purple); }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }

  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 3px solid rgba(124, 58, 237, 0.35);
    outline-offset: 2px;
  }

  /* ---------- Buttons & inputs ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: var(--r-input);
    padding: 12px 18px; font-size: 1rem; font-weight: 700;
    cursor: pointer; background: var(--green); color: #fff;
  }
  .btn:hover { background: var(--green-dark); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn.block { width: 100%; }
  .btn.secondary { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
  .btn.secondary:hover { background: #fff; }
  .btn.purple { background: var(--purple); }
  .btn.small { padding: 8px 12px; font-size: 0.9rem; }
  .link-btn {
    background: none; border: none; padding: 0; color: var(--purple);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  .input {
    width: 100%; padding: 12px 14px; font-size: 1rem; font-family: inherit;
    border: 1.5px solid var(--border); border-radius: var(--r-input);
    background: #fff; color: var(--text);
  }
  .input:focus { border-color: var(--purple); outline: none; }
  .hint { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
  .msg { padding: 10px 14px; border-radius: var(--r-input); font-size: 0.9rem; margin-bottom: 16px; }
  .msg.error { background: #FDECEA; color: var(--danger); }
  .msg.notice { background: #EAF6EA; color: #2E6B31; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r-card); padding: 20px;
  }

  /* ---------- Auth & onboarding ---------- */
  .auth-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .auth-box { width: 100%; max-width: 400px; }
  .auth-brand { text-align: center; margin-bottom: 24px; }
  .brand { font-weight: 800; font-size: 1.6rem; letter-spacing: -0.01em; }
  .brand .w2 { color: var(--purple); }
  .auth-tabs { display: flex; gap: 4px; background: #EFEBE3; padding: 4px; border-radius: 10px; margin-bottom: 20px; }
  .auth-tabs button {
    flex: 1; border: none; background: transparent; padding: 10px; border-radius: 8px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.95rem; color: var(--muted); cursor: pointer;
  }
  .auth-tabs button.active { background: #fff; color: var(--text); }
  .auth-foot { text-align: center; margin-top: 16px; font-size: 0.9rem; }

  .loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--green);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

  /* ---------- App shell ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(248, 246, 240, 0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
  }
  .topbar-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .topnav { display: none; gap: 4px; }
  .topnav button {
    border: none; background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.95rem; color: var(--muted);
  }
  .topnav button.active { background: #fff; color: var(--text); box-shadow: 0 0 0 1px var(--border); }

  main {
    max-width: 960px; margin: 0 auto; padding: 20px 16px;
    padding-bottom: calc(var(--nav-h) + 32px + env(safe-area-inset-bottom));
  }

  .bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: #fff; border-top: 1px solid var(--border);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  .bottomnav button {
    flex: 1; height: var(--nav-h); border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--muted);
  }
  .bottomnav button.active { color: var(--green); }
  .bottomnav svg { width: 24px; height: 24px; }
  .tab-label { font-size: 0.72rem; font-weight: 700; }

  @media (min-width: 768px) {
    .topnav { display: flex; }
    .bottomnav { display: none; }
    main { padding: 32px 24px 48px; }
  }

  .banner {
    background: #F3EEFF; border: 1px solid #DDD0FB; color: #4C1D95;
    border-radius: var(--r-input); padding: 10px 14px; margin-bottom: 20px;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 0.9rem;
  }
  .banner .actions { display: flex; gap: 12px; margin-left: auto; }

  .page-head { margin-bottom: 20px; }
  .stack > * + * { margin-top: 16px; }

  /* ---------- Home: week strip ---------- */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
  .day {
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 4px; text-align: center; min-height: 84px;
  }
  .day .dname { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.75rem; color: var(--muted); }
  .day .dnum { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.2rem; }
  .day.today { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .day.today .dname { color: var(--green); }
  @media (max-width: 420px) {
    .day { padding: 8px 2px; min-height: 64px; }
    .day .dnum { font-size: 1rem; }
  }
  .empty { text-align: center; padding: 28px 20px; }
  .empty p { margin: 0 auto 16px; max-width: 34ch; }

  /* ---------- Library ---------- */
  .pl-row { display: flex; align-items: center; gap: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }

  /* ---------- Search ---------- */
  .searchbar { display: flex; gap: 8px; margin-bottom: 20px; }
  .searchbar .input { flex: 1; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
  .result { min-width: 0; }
  .poster {
    width: 100%; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden;
    background: #EFEBE3; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
  }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .ph { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 2rem; color: #C9C1B3; }
  .result h3 { font-size: 0.95rem; margin-top: 8px; line-height: 1.3; }
  .result .meta { font-size: 0.8rem; color: var(--muted); }
  .pill {
    display: inline-block; font-size: 0.7rem; font-weight: 700; font-family: 'Nunito', sans-serif;
    padding: 1px 8px; border-radius: 999px; margin-right: 4px;
  }
  .pill.tv { background: #F3EEFF; color: var(--purple); }
  .pill.movie { background: #EAF6EA; color: #2E6B31; }

  /* ---------- Profile ---------- */
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .toggle {
    position: relative; width: 48px; height: 28px; flex: none; border: none; border-radius: 999px;
    background: #D6D0C4; cursor: pointer; padding: 0;
  }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; transition: left 0.15s;
  }
  .toggle.on { background: var(--green); }
  .toggle.on::after { left: 23px; }
  .credits p { font-size: 0.85rem; color: var(--muted); }

  /* ---------- Phase 1b: tiles, modal, providers ---------- */
  .tile { background: none; border: none; padding: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; width: 100%; }
  .tile:hover .poster { border-color: #CFC7B8; }
  .poster { position: relative; }
  .poster .badge {
    position: absolute; top: 6px; right: 6px; background: var(--green); color: #fff;
    border-radius: 999px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 800; box-shadow: 0 0 0 2px #fff;
  }
  .status { display: inline-block; font-size: 0.7rem; font-weight: 700; font-family: 'Nunito', sans-serif; padding: 1px 8px; border-radius: 999px; }
  .status.watching, .status.watched { background: #EAF6EA; color: #2E6B31; }
  .status.want { background: #F3EEFF; color: var(--purple); }
  .status.finished { background: #EEF0F3; color: #4B5563; }
  .status.dropped { background: #F5EFE6; color: #8A7A63; }

  .pl-head { display: flex; align-items: center; gap: 10px; margin: 28px 0 14px; }
  .pl-head:first-of-type { margin-top: 0; }
  .pl-head h2 { margin: 0; }
  .pl-head .count { color: var(--muted); font-size: 0.9rem; }

  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(26, 26, 46, 0.45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    background: var(--card); width: 100%; max-height: 92vh; overflow-y: auto;
    border-radius: var(--r-modal) var(--r-modal) 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    animation: sheetUp 0.22s ease-out;
  }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  @media (min-width: 768px) {
    .overlay { align-items: center; padding: 24px; }
    .sheet { max-width: 600px; border-radius: var(--r-modal); max-height: 88vh; padding: 28px; }
  }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); flex: none;
  }
  .icon-btn svg { width: 18px; height: 18px; }

  .d-hero { display: flex; gap: 16px; margin-bottom: 16px; }
  .d-hero .poster { width: 110px; flex: none; }
  .d-hero h2 { margin: 0 0 4px; font-size: 1.35rem; line-height: 1.2; }
  .d-meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
  .d-overview { font-size: 0.95rem; }
  .section { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
  .section h3 { margin-bottom: 10px; }

  .inlist { background: #FAF8F3; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .inlist .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 700; font-family: 'Nunito', sans-serif; }
  .inlist .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .inlist label { font-size: 0.78rem; margin-bottom: 4px; color: var(--muted); }
  select.input { padding: 10px 12px; appearance: auto; }
  .remove-btn { margin-top: 10px; background: none; border: none; color: var(--danger); font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 0; }

  .prov-group { margin-bottom: 12px; }
  .prov-group .gname { font-size: 0.8rem; font-weight: 700; font-family: 'Nunito', sans-serif; color: var(--muted); margin-bottom: 6px; }
  .prov-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .prov { position: relative; width: 44px; height: 44px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #fff; }
  .prov img { width: 100%; height: 100%; display: block; }
  .prov.mine { box-shadow: 0 0 0 3px var(--green); border-color: var(--green); }
  .mine-note { font-size: 0.85rem; color: #2E6B31; margin: 0 0 10px; font-weight: 600; }
  .attrib { font-size: 0.78rem; color: var(--muted); margin-top: 8px; }

  .choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice {
    border: 1.5px solid var(--border); background: #fff; border-radius: 999px; padding: 8px 14px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.9rem; cursor: pointer; color: var(--text);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .choice.on { border-color: var(--green); background: #EAF6EA; color: #2E6B31; }

  .svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; margin-top: 12px; }
  .svc {
    border: 1.5px solid var(--border); background: #fff; border-radius: 12px; padding: 10px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; color: var(--text);
  }
  .svc img { width: 44px; height: 44px; border-radius: 10px; }
  .svc span { font-size: 0.72rem; line-height: 1.2; text-align: center; }
  .svc.on { border-color: var(--green); background: #EAF6EA; }
  .svc-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .svc-chips img { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .sheet-actions .btn { flex: 1; }

  /* ---------- Phase 1c: library filters, progress, episodes, notes ---------- */
  .lib-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; align-items: center; }
  .lib-filters select.input { width: auto; flex: 1 1 150px; max-width: 220px; }
  .seg { display: flex; background: #EFEBE3; padding: 3px; border-radius: 10px; }
  .seg button {
    border: none; background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.9rem; color: var(--muted);
  }
  .seg button.on { background: #fff; color: var(--text); }
  @media (max-width: 480px) {
    .seg { flex: 1 1 100%; }
    .seg button { flex: 1; }
    .lib-filters select.input { max-width: none; }
  }

  .progress { height: 5px; background: #EFEBE3; border-radius: 999px; overflow: hidden; margin: 6px 0 2px; }
  .progress span { display: block; height: 100%; background: var(--green); border-radius: 999px; }
  .progress.big { height: 8px; margin: 0 0 6px; }

  .recap { background: #F3EEFF; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .recap h3 { margin-bottom: 4px; }
  .recap p { margin: 0; }
  .recap-label { font-size: 0.78rem; font-weight: 700; font-family: 'Nunito', sans-serif; color: var(--purple); margin-bottom: 2px; }
  .upnext {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1.5px solid var(--green); border-radius: 12px; padding: 12px 14px;
  }
  .upnext .recap-label { color: #2E6B31; }

  .stars { display: flex; gap: 2px; margin-bottom: 10px; }
  .star { background: none; border: none; cursor: pointer; font-size: 1.6rem; line-height: 1; color: #D6D0C4; padding: 2px; }
  .star.on { color: #E8A317; }
  .stars-static { color: #E8A317; letter-spacing: 1px; }
  textarea.note { resize: vertical; min-height: 72px; line-height: 1.45; }
  .note-actions { display: flex; justify-content: flex-end; margin: 6px 0 4px; }
  .other-note { font-size: 0.9rem; background: #FAF8F3; border-left: 3px solid var(--purple); padding: 8px 10px; border-radius: 0 8px 8px 0; margin-top: 8px; }

  .season-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .season-tabs button {
    flex: none; border: 1.5px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 12px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.85rem; cursor: pointer; color: var(--text);
  }
  .season-tabs button.on { background: var(--text); border-color: var(--text); color: #fff; }
  .season-bar { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 10px; font-size: 0.9rem; }
  .note-box { background: #FAF8F3; border-radius: 12px; padding: 12px; margin-bottom: 12px; }

  .eps { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .ep + .ep { border-top: 1px solid var(--border); }
  .ep-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .check {
    width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid #CFC7B8; background: #fff;
    color: #fff; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
  }
  .check.on { background: var(--green); border-color: var(--green); }
  .check:disabled { opacity: 0.35; cursor: default; }
  .ep-title {
    flex: 1; min-width: 0; background: none; border: none; padding: 0; text-align: left; cursor: pointer;
    font: inherit; font-size: 0.92rem; color: var(--text); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px;
  }
  .ep.done .ep-title { color: var(--muted); }
  .ep-num { font-family: 'Nunito', sans-serif; font-weight: 800; }
  .ep-date { flex-basis: 100%; font-size: 0.78rem; color: var(--muted); }
  .note-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--purple); display: inline-block; align-self: center; }
  .ep-body { padding: 0 12px 12px 50px; }
  @media (max-width: 420px) { .ep-body { padding-left: 12px; } }

  .watch-list { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; }
  .watch-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; font-size: 0.92rem; }
  .watch-row + .watch-row { border-top: 1px solid var(--border); }
  .log-row { display: flex; gap: 8px; }
  .log-row .input { flex: 1; }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, sendPasswordResetEmail, sendEmailVerification
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, collection, writeBatch, serverTimestamp,
  query, where, onSnapshot, deleteField, arrayUnion, arrayRemove
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

// ---------- Config ----------
const firebaseConfig = {
  apiKey: "AIzaSyD7n0HTNNPsKf5-npCgZZ_ane3ryyt29R8",
  authDomain: "wellwatched.firebaseapp.com",
  projectId: "wellwatched",
  storageBucket: "wellwatched.firebasestorage.app",
  messagingSenderId: "164364358788",
  appId: "1:164364358788:web:a7a9a271574ca7ecb29ed1"
};
const WORKER_URL = "https://wellwatched-worker.matt-zmud.workers.dev";
const IMG_BASE = "https://image.tmdb.org/t/p/w342";

const APP_URL = "https://watch.wellreadco.app/";
const VERIFY_SETTINGS = { url: APP_URL };
const STEP_TIMEOUT_MS = 15000;

const STATUS = {
  tv: [
    { id: 'watching', label: 'Watching' },
    { id: 'want', label: 'Want to watch' },
    { id: 'finished', label: 'Finished' },
    { id: 'dropped', label: 'Dropped' }
  ],
  movie: [
    { id: 'want', label: 'Want to watch' },
    { id: 'watched', label: 'Watched' }
  ]
};
const STATUS_ORDER = ['watching', 'want', 'watched', 'finished', 'dropped'];

function statusLabel(mediaType, id) {
  const s = (STATUS[mediaType] || []).find(x => x.id === id);
  return s ? s.label : id;

// Fails loudly instead of hanging forever, and logs each step
function step(label, promise) {
  console.log('[WW] start: ' + label);
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => {
      const err = new Error('Timed out at step: ' + label);
      err.code = 'ww/timeout';
      reject(err);
    }, STEP_TIMEOUT_MS);
  });
  return Promise.race([promise, timeout]).then(
    (v) => { clearTimeout(timer); console.log('[WW] done: ' + label); return v; },
    (e) => { clearTimeout(timer); console.error('[WW] failed: ' + label, e); throw e; }
  );
}

async function api(action, data) {
  const user = auth.currentUser;
  if (!user) throw new Error('You are signed out.');
  const token = await user.getIdToken();
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(Object.assign({ action: action }, data || {}))
  });
  let body = {};
  try { body = await res.json(); } catch (e) { /* non-JSON */ }
  if (!res.ok) throw new Error(body.error || ('Request failed (' + res.status + ')'));
  return body;
}

function startListeners() {
  stopListeners();
  const uid = S.user.uid;
  const q = query(collection(db, 'playlists'), where('memberUids', 'array-contains', uid));
  unsubPlaylists = onSnapshot(q, (snap) => {
    const lists = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    lists.sort((a, b) => {
      if (a.isPersonal && !b.isPersonal) return -1;
      if (b.isPersonal && !a.isPersonal) return 1;
      return String(a.name).localeCompare(String(b.name));
    });
    S.playlists = lists;
    const ids = lists.map(l => l.id);
    // Subscribe to items of new playlists
    ids.forEach(pid => {
      if (unsubItems[pid]) return;
      unsubItems[pid] = onSnapshot(collection(db, 'playlists', pid, 'items'), (isnap) => {
        S.items[pid] = isnap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        onDataChange();
      }, (err) => console.error('[WW] items listener', pid, err));
    });
    // Unsubscribe from playlists I'm no longer in
    Object.keys(unsubItems).forEach(pid => {
      if (ids.indexOf(pid) === -1) {
        unsubItems[pid]();
        delete unsubItems[pid];
        delete S.items[pid];
      }
    });
    onDataChange();
  }, (err) => {
    console.error('[WW] playlists listener', err);
    S.error = 'Couldn\'t load your playlists: ' + err.message;
    onDataChange();
  });
}

function stopListeners() {
  if (unsubPlaylists) { unsubPlaylists(); unsubPlaylists = null; }
  Object.keys(unsubItems).forEach(pid => unsubItems[pid]());
  unsubItems = {};
  S.playlists = [];
  S.items = {};
}

// Picks which playlist's copy of this title the detail sheet tracks, and listens to its notes
function ensureCtx() {
  const m = S.modal;
  if (!m || !m.key) return;
  const mem = memberships(m.key);
  if (!mem.length) {
    m.ctxPid = null;
    stopPeople();
    m.people = {};
    return;
  }
  if (!m.ctxPid || !mem.some(x => x.playlist.id === m.ctxPid)) {
    const preferred = m.preferPid && mem.find(x => x.playlist.id === m.preferPid);
    m.ctxPid = (preferred || mem[0]).playlist.id;
  }
  if (m.peopleFor !== m.ctxPid) startPeople(m.ctxPid, m.key);
  initSeason();
}

function startPeople(pid, key) {

  unsubPeople = onSnapshot(collection(db, 'playlists', pid, 'items', key, 'people'), (snap) => {
    if (!S.modal || S.modal.key !== key || S.modal.peopleFor !== pid) return;
    const people = {};

    S.modal.people = people;

// Chooses the starting season (where "up next" is) and loads the episodes needed on screen
function initSeason() {
  const m = S.modal;
  const d = m && m.data;
  if (!d || d.mediaType !== 'tv' || !(d.seasonList || []).length) return;
  const item = ctxItem();
  if (!m.season) {
    const nk = item ? nextUpKey(item) : null;
    const pk = item ? previousKey(item) : null;
    const anchor = parseEpKey(nk || pk);
    m.season = anchor ? anchor.s : d.seasonList[0].number;
  }
  loadSeason(d.tmdbId, m.season);
  if (item) {
    [nextUpKey(item), previousKey(item)].forEach(k => {
      const p = parseEpKey(k);
      if (p) loadSeason(d.tmdbId, p.s);
    });
  }
}

// Keeps stored show metadata (episode counts, latest aired) current so progress stays accurate
function refreshStoredItems(d) {
  memberships(itemKey(d.mediaType, d.tmdbId)).forEach(x => {
    const it = x.item;
    const fields = { title: d.title, posterPath: d.posterPath || null };
    if (d.mediaType === 'tv') Object.assign(fields, tvMeta(d));
    const changed = Object.keys(fields).some(k => JSON.stringify(it[k] == null ? null : it[k]) !== JSON.stringify(fields[k]));
    if (!changed) return;
    fields.lastRefreshed = serverTimestamp();
    setDoc(doc(db, 'playlists', x.playlist.id, 'items', it.id), fields, { merge: true })
      .catch(e => console.error('[WW] refresh item failed', e));
  });
}

function tvMeta(d) {
  const counts = {};
  (d.seasonList || []).forEach(se => { counts[String(se.number)] = se.episodeCount; });
  return {
    seasonCounts: counts,
    lastAired: d.lastAired ? { s: d.lastAired.s, e: d.lastAired.e } : null,
    nextAir: d.nextAir || null,
    showStatus: d.status || ''
  };
}

// Where is this title? -> [{ playlist, item }]
function memberships(key) {
  const out = [];
  S.playlists.forEach(pl => {
    const it = (S.items[pl.id] || []).find(i => i.id === key);
    if (it) out.push({ playlist: pl, item: it });

  return out;
}

// ---------- Episode progress helpers ----------
function epKey(s, e) {
  return 's' + s + 'e' + e;
}
function parseEpKey(k) {
  const m = /^s(\d+)e(\d+)$/.exec(k || '');
  return m ? { s: parseFloat(m[1]), e: parseFloat(m[2]) } : null;
}
function epLabel(k) {
  const p = parseEpKey(k);
  return p ? 'S' + p.s + ' E' + p.e : '';
}
function todayIso() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Every aired episode key, in order, based on the item's stored season counts
function airedKeys(item) {
  const out = [];
  if (!item || !item.seasonCounts || !item.lastAired) return out;
  const la = item.lastAired;
  Object.keys(item.seasonCounts).map(x => parseFloat(x)).sort((a, b) => a - b).forEach(sn => {
    if (sn > la.s) return;
    const count = sn === la.s ? la.e : parseFloat(item.seasonCounts[sn]) || 0;
    for (let e = 1; e <= count; e++) out.push(epKey(sn, e));
  });
  return out;
}
function isWatched(item, k) {
  return !!(item && item.watched && item.watched[k]);
}
function progressOf(item) {
  const keys = airedKeys(item);
  const watched = keys.filter(k => isWatched(item, k)).length;
  return { watched: watched, aired: keys.length };
}
function nextUpKey(item) {
  return airedKeys(item).find(k => !isWatched(item, k)) || null;
}
// The episode to recap: the one right before "up next", or the latest if caught up
function previousKey(item) {
  const keys = airedKeys(item);
  const next = nextUpKey(item);
  const idx = next ? keys.indexOf(next) : keys.length;
  const k = idx > 0 ? keys[idx - 1] : null;
  return k && isWatched(item, k) ? k : null;
}
function seasonCacheKey(tmdbId, sn) {
  return tmdbId + '_' + sn;
}
function findEpisode(tmdbId, k) {
  const p = parseEpKey(k);
  if (!p) return null;
  const c = S.seasonCache[seasonCacheKey(tmdbId, p.s)];
  return (c && c.episodes) ? (c.episodes.find(x => x.e === p.e) || null) : null;
}
async function loadSeason(tmdbId, sn) {
  const ck = seasonCacheKey(tmdbId, sn);
  if (S.seasonCache[ck] && !S.seasonCache[ck].error) return;
  S.seasonCache[ck] = { loading: true };
  try {
    const d = await api('season', { tmdbId: tmdbId, season: sn });
    S.seasonCache[ck] = { episodes: d.episodes || [] };
  } catch (e) {
    S.seasonCache[ck] = { error: e.message };
  }
  if (S.modal && S.modal.view === 'detail' && S.modal.tmdbId === tmdbId) renderModal();
}

function libraryTileHtml(it, pid) {

function viewLibrary() {

  S.playlists.forEach(pl => {
    const all = S.items[pl.id] || [];
    const items = all.filter(passesLibFilter).sort((a, b) => {
      const sa = STATUS_ORDER.indexOf(a.status), sb = STATUS_ORDER.indexOf(b.status);

      return String(a.title).localeCompare(String(b.title));
    });
    h += '<div class="pl-head"><span class="dot" style="background:' + esc(pl.color || '#4CAF50') + '"></span>';

    h += '</span></div>';
    if (!all.length) {
      h += '<div class="card empty"><p class="muted">Nothing here yet. Search for a show or movie and add it to this list.</p>';

function whereToWatchHtml(d) {
  const pv = d.providers || {};
  const mine = myServiceIds();
  const free = (pv.free || []).concat((pv.ads || []).filter(a => !(pv.free || []).some(f => f.id === a.id)));
  const groups = [
    { name: 'Stream', list: pv.stream || [] },
    { name: 'Free', list: free },
    { name: 'Rent', list: pv.rent || [] },
    { name: 'Buy', list: pv.buy || [] }
  ].filter(g => g.list.length);

  let h = '<div class="section"><h3>Where to watch</h3>';
  if (!groups.length) {
    h += '<p class="muted small">Not available to stream, rent, or buy in the US right now.</p>';
  } else {
    const onMine = (pv.stream || []).concat(free).filter(p => mine.indexOf(String(p.id)) !== -1);
    if (onMine.length) h += '<p class="mine-note">On your services: ' + esc(onMine.map(p => p.name).join(', ')) + '</p>';
    groups.forEach(g => {
      h += '<div class="prov-group"><div class="gname">' + g.name + '</div>' + providerTiles(g.list, mine) + '</div>';
    });
  }
  h += '<div class="attrib">Availability from JustWatch.';
  if (pv.link) h += ' <a href="' + esc(pv.link) + '" target="_blank" rel="noopener">See all options on TMDB</a>';
  h += '</div></div>';
  return h;
}

// Options for "where I watch": this title's stream/free providers, then my services, then current value
function platformOptions(d, current) {
  const pv = (d && d.providers) || {};
  const seen = {};
  const out = [];
  function add(p) {
    if (!p || seen[p.id]) return;
    seen[p.id] = true;
    out.push({ id: p.id, name: p.name });
  }
  (pv.stream || []).forEach(add);
  (pv.free || []).forEach(add);
  (pv.ads || []).forEach(add);
  myServices().forEach(add);
  add(current);
  return out;
}

function draftOr(k, fallback) {

}

function starsHtml(current) {
  let h = '<div class="stars" role="group" aria-label="Your rating">';
  for (let i = 1; i <= 5; i++) {
    const on = current && i <= current;
    h += '<button type="button" class="star' + (on ? ' on' : '') + '" aria-label="' + i + (i === 1 ? ' star' : ' stars') + '" aria-pressed="' + (current === i) + '" onclick="setMyRating(' + i + ')">' + (on ? '&#9733;' : '&#9734;') + '</button>';
  }
  h += '</div>';
  return h;
}

function noteEditorHtml(draftKey, stored, placeholder, saveCall) {
  const id = 'note_' + draftKey;
  const val = draftOr(draftKey, stored);

  let h = '<textarea class="input note" id="' + esc(id) + '" rows="3" placeholder="' + esc(placeholder) + '" oninput="setDraft(\'' + draftKey + '\', this.value)">' + esc(val) + '</textarea>';
  h += '<div class="note-actions"><button class="btn small" onclick="' + saveCall + '"' + (dirty ? '' : ' disabled') + ' id="save_' + esc(draftKey) + '">Save note</button></div>';

}

function othersNotesHtml(getter) {

function episodeOverview(ep) {

}

function tvProgressHtml(d, item) {
  const m = S.modal;
  const pr = progressOf(item);
  let h = '';
  if (pr.aired) {
    const pct = Math.round((pr.watched / pr.aired) * 100);
    h += '<div class="progress big" aria-hidden="true"><span style="width:' + pct + '%"></span></div>';
    h += '<div class="small muted" style="margin-bottom:12px">' + (pr.watched >= pr.aired ? 'Caught up on all ' + pr.aired + ' aired episodes' : pr.watched + ' of ' + pr.aired + ' aired episodes watched') + '</div>';
  }

  const prevK = previousKey(item);
  if (prevK) {
    const ep = findEpisode(d.tmdbId, prevK);
    h += '<div class="recap"><div class="recap-label">Previously on ' + esc(d.title) + '</div>';
    h += '<h3>' + esc(epLabel(prevK)) + (ep && ep.name ? ': ' + esc(ep.name) : '') + '</h3>';
    h += ep ? '<p class="small">' + esc(episodeOverview(ep)) + '</p>' : '<p class="small muted">Loading…</p>';
    h += '</div>';
  }

  const nextK = nextUpKey(item);
  if (nextK) {
    const ep = findEpisode(d.tmdbId, nextK);
    h += '<div class="upnext"><div><div class="recap-label">Up next</div>';
    h += '<h3>' + esc(epLabel(nextK)) + (ep && ep.name ? ': ' + esc(ep.name) : '') + '</h3></div>';
    h += '<button class="btn small" onclick="toggleEp(\'' + nextK + '\')">Mark watched</button></div>';
  } else if (item.nextAir) {
    h += '<div class="upnext"><div><div class="recap-label">Next episode</div>';
    h += '<h3>' + esc(epLabel(epKey(item.nextAir.s, item.nextAir.e))) + (item.nextAir.name ? ': ' + esc(item.nextAir.name) : '') + '</h3>';
    if (item.nextAir.date) h += '<div class="small muted">Airs ' + esc(fmtDate(item.nextAir.date)) + '</div>';
    h += '</div></div>';
  }
  return h;
}

function episodesHtml(d, item) {
  const m = S.modal;
  const seasons = d.seasonList || [];
  if (!seasons.length) return '';
  const sn = m.season || seasons[0].number;
  const me = myPeopleDoc();
  let h = '<div class="section"><h3>Episodes</h3>';
  h += '<div class="season-tabs" role="tablist">';
  seasons.forEach(se => {
    h += '<button type="button" class="' + (se.number === sn ? 'on' : '') + '" onclick="setSeason(' + se.number + ')">S' + se.number + '</button>';
  });
  h += '</div>';

  const cache = S.seasonCache[seasonCacheKey(d.tmdbId, sn)];
  if (!cache || cache.loading) return h + '<div class="loading" style="min-height:120px"><div class="spinner" aria-label="Loading episodes"></div></div></div>';
  if (cache.error) return h + '<div class="msg error" role="alert">Couldn\'t load episodes: ' + esc(cache.error) + '</div></div>';

  const today = todayIso();
  const eps = cache.episodes;
  const airedInSeason = eps.filter(ep => ep.airDate && ep.airDate <= today);
  const allWatched = airedInSeason.length && airedInSeason.every(ep => isWatched(item, epKey(sn, ep.e)));

  // Season note + mark season
  const seasonNote = me.seasons && me.seasons[sn] ? me.seasons[sn].note : '';
  h += '<div class="season-bar">';
  if (airedInSeason.length && !allWatched) h += '<button class="link-btn" onclick="markSeason(' + sn + ')">Mark season ' + sn + ' watched</button>';
  h += '<button class="link-btn" onclick="toggleSeasonNote()">' + (m.seasonNoteOpen ? 'Hide season note' : (seasonNote ? 'Season note' : 'Add season note')) + '</button>';
  h += '</div>';
  if (m.seasonNoteOpen) {
    h += '<div class="note-box">' + noteEditorHtml('season_' + sn, seasonNote, 'Thoughts on season ' + sn + '…', 'saveNote(\'season\', \'' + sn + '\')');
    h += othersNotesHtml(p => p.seasons && p.seasons[sn] ? p.seasons[sn].note : '') + '</div>';
  }

  h += '<div class="eps">';
  eps.forEach(ep => {
    const k = epKey(sn, ep.e);
    const watched = isWatched(item, k);
    const future = !ep.airDate || ep.airDate > today;
    const open = m.openEp === k;
    const myNote = me.episodes && me.episodes[k] ? me.episodes[k].note : '';
    const hasOtherNote = otherPeople().some(p => p.episodes && p.episodes[k] && p.episodes[k].note);
    h += '<div class="ep' + (watched ? ' done' : '') + (open ? ' open' : '') + '">';
    h += '<div class="ep-row">';
    h += '<button type="button" class="check' + (watched ? ' on' : '') + '" aria-label="' + (watched ? 'Mark unwatched' : 'Mark watched') + ': ' + esc(epLabel(k)) + '"' + (future ? ' disabled' : '') + ' onclick="toggleEp(\'' + k + '\')">' + (watched ? '&#10003;' : '') + '</button>';
    h += '<button type="button" class="ep-title" onclick="toggleEpOpen(\'' + k + '\')" aria-expanded="' + open + '">';
    h += '<span class="ep-num">E' + ep.e + '</span> ' + esc(ep.name || 'Episode ' + ep.e);
    if (myNote || hasOtherNote) h += ' <span class="note-dot" title="Has notes"></span>';
    h += '<span class="ep-date">' + (ep.airDate ? (future ? 'Airs ' : '') + esc(fmtDate(ep.airDate)) : 'Date TBA') + '</span>';
    h += '</button></div>';
    if (open) {
      h += '<div class="ep-body"><p class="small">' + esc(episodeOverview(ep)) + '</p>';
      if (!future && !watched) h += '<button class="link-btn small" style="margin-bottom:10px" onclick="markThrough(\'' + k + '\')">Mark all watched through ' + esc(epLabel(k)) + '</button>';
      h += noteEditorHtml('ep_' + k, myNote, 'Your notes on this episode…', 'saveNote(\'episode\', \'' + k + '\')');
      h += othersNotesHtml(p => p.episodes && p.episodes[k] ? p.episodes[k].note : '');
      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

function viewDetailModal() {
  const m = S.modal;
  let h = sheetTop('', false);
  if (m.error) return h + '<div class="msg error" role="alert">' + esc(m.error) + '</div>';
  const d = m.data;
  if (!d) return h + '<div class="loading" style="min-height:220px"><div class="spinner" aria-label="Loading"></div></div>';

  const meta = [];
  meta.push(d.mediaType === 'tv' ? 'TV' : 'Movie');
  if (d.year) meta.push(d.year);
  if (d.mediaType === 'tv' && d.seasons) meta.push(d.seasons + (d.seasons === 1 ? ' season' : ' seasons'));
  if (d.runtime) meta.push(d.runtime + ' min');

  h += '<div class="d-hero">' + posterHtml(d.posterPath, d.title, false) + '<div>';
  h += '<h2>' + esc(d.title) + '</h2>';
  h += '<div class="d-meta">' + esc(meta.join(', ')) + '</div>';
  if (d.genres && d.genres.length) h += '<div class="d-meta">' + esc(d.genres.slice(0, 3).join(', ')) + '</div>';
  if (d.mediaType === 'tv' && d.networks && d.networks.length) h += '<div class="d-meta">' + esc(d.networks.join(', ')) + (d.status ? ' (' + esc(d.status) + ')' : '') + '</div>';
  if (d.mediaType === 'movie' && d.releases) {
    if (d.releases.theatrical) h += '<div class="d-meta">In theaters ' + esc(fmtDate(d.releases.theatrical)) + '</div>';
    if (d.releases.digital) h += '<div class="d-meta">Digital release ' + esc(fmtDate(d.releases.digital)) + '</div>';
  }
  h += '</div></div>';
  if (d.overview) h += '<p class="d-overview">' + esc(d.overview) + '</p>';
  if (m.error2) h += '<div class="msg error" role="alert">' + esc(m.error2) + '</div>';

  const mem = memberships(m.key);
  const item = ctxItem();

  // Progress / recap (TV) before list management, since it's what you open the sheet for

function renderModal() {
  const root = document.getElementById('modal');
  const m = S.modal;
  if (!m) {
    root.innerHTML = '';
    document.body.style.overflow = '';
    return;
  }
  let inner = '';
  if (m.view === 'detail') inner = viewDetailModal();
  else if (m.view === 'add') inner = viewAddModal();
  else if (m.view === 'services') inner = viewServicesModal();
  // Keep the scroll position when re-rendering the same view (e.g. after a live update)
  const sheet = root.querySelector('.sheet');
  const sameView = sheet && sheet.getAttribute('data-view') === m.view + ':' + (m.key || '');
  const scrollTop = sheet ? sheet.scrollTop : 0;
  // Remember what's focused (e.g. a note being typed) so live updates don't interrupt typing
  const ae = document.activeElement;
  const focusId = (ae && ae.id && root.contains(ae)) ? ae.id : null;
  let selStart = null, selEnd = null;
  try {
    if (focusId && ae.selectionStart != null) { selStart = ae.selectionStart; selEnd = ae.selectionEnd; }
  } catch (e) { /* date/select inputs have no text selection */ }
  root.innerHTML = '<div class="overlay" onclick="if (event.target === this) closeModal()"><div class="sheet" role="dialog" aria-modal="true" data-view="' + esc(m.view + ':' + (m.key || '')) + '">' + inner + '</div></div>';
  document.body.style.overflow = 'hidden';
  const newSheet = root.querySelector('.sheet');
  if (newSheet && sameView) newSheet.scrollTop = scrollTop;
  if (focusId && sameView) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus({ preventScroll: true });
      if (selStart != null && typeof el.setSelectionRange === 'function') {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text field */ }
      }
    }
  }
}

window.completeOnboarding = async function () {
  const displayName = val('obName').trim();
  const username = val('obUsername').trim().toLowerCase();
  S.error = '';
  if (!displayName) { S.error = 'Enter a display name.'; render(); return; }
  if (!USERNAME_RE.test(username)) {
    S.error = 'Usernames are 3–20 characters: lowercase letters, numbers, and underscores.';
    render();
    return;
  }
  S.busy = true;
  S.busyLabel = 'Checking username…';
  render();
  const uid = S.user.uid;
  try {
    const taken = await step('check username', getDoc(doc(db, 'usernames', username)));
    if (taken.exists()) throw new Error('taken');
    S.busyLabel = 'Saving profile…';
    render();

    const plRef = doc(collection(db, 'playlists'));
    const batch = writeBatch(db);
    batch.set(doc(db, 'usernames', username), { uid: uid }, { merge: true });
    batch.set(doc(db, 'profiles', uid), {
      username: username,
      displayName: displayName,
      discoverable: true,
      createdAt: serverTimestamp()
    }, { merge: true });
    batch.set(plRef, {
      name: 'My List',
      ownerUid: uid,
      memberUids: [uid],
      isPersonal: true,
      color: '#4CAF50',
      createdAt: serverTimestamp()
    }, { merge: true });
    batch.set(doc(db, 'users', uid), {
      email: S.user.email,
      personalPlaylistId: plRef.id,
      services: [],
      createdAt: serverTimestamp()
    }, { merge: true });
    await step('save profile batch', batch.commit());

    S.busyLabel = 'Loading your list…';
    render();
    await loadAccount();
    S.busy = false;
    S.busyLabel = '';
    S.screen = 'app';
    S.tab = 'home';
    render();
    startListeners();
  } catch (e) {
    S.busy = false;
    S.busyLabel = '';
    if (e.message === 'taken') {
      S.error = '@' + username + ' is taken. Try another username.';
    } else {
      S.error = 'Couldn\'t save your profile. ' + (e.code ? '[' + e.code + '] ' : '') + (e.message || 'Unknown error');
    }
    render();
    const nameEl = document.getElementById('obName');
    const userEl = document.getElementById('obUsername');
    if (nameEl) nameEl.value = displayName;
    if (userEl) userEl.value = username;
  }
};

// Status to set after marking episodes: start "Watching", or "Finished" when an ended show is complete
function statusAfterWatching(item, newlyWatched) {
  const keys = airedKeys(item);
  const done = keys.length && keys.every(k => isWatched(item, k) || newlyWatched.indexOf(k) !== -1);
  const ended = /ended|canceled|cancelled/i.test(item.showStatus || '');
  if (done && ended) return 'finished';
  if (item.status === 'want') return 'watching';
  return null;
}

async function markEpisodes(keys) {
  const m = S.modal;
  const item = ctxItem();
  if (!item || !keys.length) return;
  const watched = {};
  keys.forEach(k => { watched[k] = serverTimestamp(); });
  const fields = { watched: watched, updatedAt: serverTimestamp() };
  const next = statusAfterWatching(item, keys);
  if (next && next !== item.status) fields.status = next;
  try {
    await setDoc(itemRef(), fields, { merge: true });
  } catch (e) {
    m.error2 = 'Couldn\'t save progress: ' + e.message;
    renderModal();
  }
}

window.toggleEp = async function (k) {
  const m = S.modal;
  const item = ctxItem();
  if (!item) return;
  if (isWatched(item, k)) {
    try {
      const w = {};
      w[k] = deleteField();
      await setDoc(itemRef(), { watched: w, updatedAt: serverTimestamp() }, { merge: true });
    } catch (e) {
      m.error2 = 'Couldn\'t save progress: ' + e.message;
      renderModal();
    }
  } else {
    await markEpisodes([k]);
  }
};

window.markThrough = function (k) {
  const item = ctxItem();
  const keys = airedKeys(item);
  const idx = keys.indexOf(k);
  if (idx === -1) return;
  const todo = keys.slice(0, idx + 1).filter(x => !isWatched(item, x));
  if (todo.length > 1 && !confirm('Mark ' + todo.length + ' episodes as watched?')) return;
  markEpisodes(todo);
};

window.markSeason = function (sn) {
  const item = ctxItem();
  const todo = airedKeys(item).filter(k => parseEpKey(k).s === sn && !isWatched(item, k));
  if (!todo.length) return;
  if (!confirm('Mark ' + todo.length + ' episodes in season ' + sn + ' as watched?')) return;
  markEpisodes(todo);
};

  if (!m || !m.form || !m.form.pid) return;
  const d = m.data;

  const opts = platformOptions(d, null);

    mediaType: d.mediaType,

    posterPath: d.posterPath || null,
    genres: d.genres || [],
    imdbId: d.imdbId || null,
    tvdbId: d.tvdbId || null,
    status: f.status,
    platform: p ? { id: p.id, name: p.name } : null,
    addedBy: S.user.uid,
    addedAt: serverTimestamp(),
    updatedAt: serverTimestamp(),
    lastRefreshed: serverTimestamp()
  };
  if (d.mediaType === 'tv') {
    item.dayOffset = 0;
    item.watched = {};

  try {
    await step('add item', setDoc(doc(db, 'playlists', f.pid, 'items', m.key), item, { merge: true }));
    if (S.modal === m) {
      m.view = 'detail';
      m.saving = false;
      m.ctxPid = f.pid;
      ensureCtx();
      renderModal();
    }
  } catch (e) {
    m.saving = false;
    m.error2 = 'Couldn\'t add it: ' + (e.code ? '[' + e.code + '] ' : '') + e.message;
    renderModal();
  }
};

// ----- My services -----
window.openServices = async function () {
  // Service ids are brand keys like 'paramount-plus'; drop any older numeric ids
  S.modal = { view: 'services', selected: myServiceIds().filter(id => isNaN(parseFloat(id))), filter: '', error: '' };
  renderModal();
  if (S.providerCatalog) return;
  try {
    const data = await api('providers', {});
    S.providerCatalog = data.providers || [];
  } catch (e) {
    if (S.modal && S.modal.view === 'services') S.modal.error = 'Couldn\'t load services: ' + e.message;
  }
  if (S.modal && S.modal.view === 'services') renderModal();
};

window.toggleService = function (id) {
  const m = S.modal;
  if (!m || m.view !== 'services') return;
  // Compare as strings so ids work whether they arrive as numbers or brand keys
  const i = m.selected.findIndex(x => String(x) === String(id));
  if (i === -1) m.selected.push(String(id)); else m.selected.splice(i, 1);
  renderModal();
};

window.filterServices = function (v) {
  S.modal.filter = v;
  const grid = document.getElementById('svcGrid');
  if (grid) grid.innerHTML = servicesGridHtml();
};

window.saveServices = async function () {
  const m = S.modal;
  const catalog = S.providerCatalog || [];
  const prior = myServices();
  const services = m.selected.map(id => {
    const p = catalog.find(x => String(x.id) === String(id)) || prior.find(x => String(x.id) === String(id));
    return p ? { id: p.id, name: p.name, logoPath: p.logoPath || null } : null;
  }).filter(Boolean);
  m.saving = true;
  renderModal();
  try {
    await step('save services', setDoc(doc(db, 'users', S.user.uid), { services: services }, { merge: true }));
    S.userDoc = Object.assign({}, S.userDoc || {}, { services: services });
    S.modal = null;
    renderModal();
    render();
  } catch (e) {
    m.saving = false;
    m.error = 'Couldn\'t save your services: ' + e.message;
    renderModal();
  }
};

window.toggleDiscoverable = async function () {
  const next = !(S.profile && S.profile.discoverable);
  S.profile.discoverable = next;
  render();
  try {
    await setDoc(doc(db, 'profiles', S.user.uid), { discoverable: next }, { merge: true });
  } catch (e) {
    S.profile.discoverable = !next;
    S.error = 'Couldn\'t save that setting: ' + e.message;
    render();
  }
};

window.resendVerification = async function () {
  S.error = '';
  S.notice = '';
  try {
    await sendEmailVerification(auth.currentUser, VERIFY_SETTINGS);
    S.notice = 'Verification email sent to ' + auth.currentUser.email + '.';
  } catch (e) {
    S.error = authErrorText(e);
  }
  render();
};

window.refreshVerification = async function () {
  S.error = '';
  S.notice = '';
  try {
    await auth.currentUser.reload();
    await auth.currentUser.getIdToken(true);
    S.user = auth.currentUser;
    if (!S.user.emailVerified) S.notice = 'Not verified yet. Open the link in the email, then try again.';
  } catch (e) {
    S.error = e.message;
  }
  render();
};

window.doSignOut = async function () {
  S.modal = null;
  renderModal();
  stopListeners();
  await signOut(auth);
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.modal) window.closeModal();
});

// ---------- Boot ----------
render();

onAuthStateChanged(auth, async (user) => {
  S.user = user;
  S.error = '';
  S.notice = '';
  // Each screen starts un-busy; the login/signup button's busy state must not carry over
  S.busy = false;
  S.busyLabel = '';
  if (!user) {
    stopListeners();
    S.profile = null;
    S.userDoc = null;
    S.personal = null;
    S.modal = null;
    S.detailCache = {};
    S.seasonCache = {};
    S.search = { q: '', results: [], loading: false, error: '', done: false, reqId: 0 };
    S.screen = 'auth';
    renderModal();
    render();
    return;
  }
  S.screen = 'loading';
  render();
  try {
    await loadAccount();
  } catch (e) {
    S.error = 'Couldn\'t load your account. ' + (e.code ? '[' + e.code + '] ' : '') + e.message;
  }
  S.screen = S.profile ? 'app' : 'onboarding';
  render();
  if (S.screen === 'app') startListeners();
});
</script>
</body>
</html>
