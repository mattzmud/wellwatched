  h += '<div class="card"><div class="row-between"><div><h3>My services</h3>';
  h += '<div class="small muted">' + (svcs.length ? 'Titles on these are highlighted.' : 'Pick the streaming services you pay for.') + '</div></div>';
  h += '<button class="btn secondary small" onclick="openServices()">' + (svcs.length ? 'Edit' : 'Choose') + '</button></div>';
  if (svcs.length) {
    h += '<div class="svc-chips">';
    svcs.forEach(sv => {
      h += sv.logoPath ? '<img src="' + LOGO_BASE + esc(sv.logoPath) + '" alt="' + esc(sv.name) + '" title="' + esc(sv.name) + '">' : '<span class="pill tv">' + esc(sv.name) + '</span>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="card row-between"><div><h3>Let people find me</h3>';
  h += '<div class="small muted">Others can search your username to invite you to a playlist.</div></div>';
  h += '<button type="button" class="toggle' + (p.discoverable ? ' on' : '') + '" role="switch" aria-checked="' + (p.discoverable ? 'true' : 'false') + '" aria-label="Let people find me" onclick="toggleDiscoverable()"></button></div>';

  h += '<div class="card credits"><h3 style="margin-bottom:8px">About</h3>';
  h += '<p>Show and movie data from <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>';
  h += '<p>Streaming availability from <a href="https://www.justwatch.com" target="_blank" rel="noopener">JustWatch</a>.</p>';
  h += '<p style="margin:0">TV schedule data from <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a>.</p></div>';

  h += '<button class="btn secondary block" onclick="doSignOut()">Log out</button>';
  h += '</div>';
  return h;
}

// ---------- Modal views ----------
function sheetTop(title, showBack) {
  let h = '<div class="sheet-top">';
  h += showBack ? '<button class="icon-btn" aria-label="Back" onclick="modalBack()">' + ICONS.back + '</button>' : '<span></span>';
  if (title) h += '<h2 style="margin:0;flex:1;font-size:1.1rem">' + esc(title) + '</h2>';
  h += '<button class="icon-btn" aria-label="Close" onclick="closeModal()">' + ICONS.close + '</button></div>';
  return h;
}

function providerTiles(list, mine) {
  let h = '<div class="prov-row">';
  list.forEach(p => {
    const isMine = mine.indexOf(String(p.id)) !== -1;
    h += '<div class="prov' + (isMine ? ' mine' : '') + '" title="' + esc(p.name) + '">';
    h += p.logoPath ? '<img loading="lazy" src="' + LOGO_BASE + esc(p.logoPath) + '" alt="' + esc(p.name) + '">' : '';
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function whereToWatchHtml(d) {
  const pv = d.providers || {};
  const mine = myServiceIds();
  const free = (pv.free || []).concat((pv.ads || []).filter(a => !(pv.free || []).some(f => f.id === a.id)));
  const groups = [
    { name: 'Stream', list: pv.stream || [] },
    { name: 'Free', list: free },
    { name: 'Rent', list: pv.rent || [] },
    { name: 'Buy', list: pv.buy || [] }
  ].filter(g => g.list.length);

  let h = '<div class="section"><h3>Where to watch</h3>';
  if (!groups.length) {
    h += '<p class="muted small">Not available to stream, rent, or buy in the US right now.</p>';
  } else {
    const onMine = (pv.stream || []).concat(free).filter(p => mine.indexOf(String(p.id)) !== -1);
    if (onMine.length) h += '<p class="mine-note">On your services: ' + esc(onMine.map(p => p.name).join(', ')) + '</p>';
    groups.forEach(g => {
      h += '<div class="prov-group"><div class="gname">' + g.name + '</div>' + providerTiles(g.list, mine) + '</div>';
    });
  }
  h += '<div class="attrib">Availability from JustWatch.';
  if (pv.link) h += ' <a href="' + esc(pv.link) + '" target="_blank" rel="noopener">See all options on TMDB</a>';
  h += '</div></div>';
  return h;
}

// Options for "where I watch": this title's stream/free providers, then my services, then current value
function platformOptions(d, current) {
  const pv = (d && d.providers) || {};
  const seen = {};
  const out = [];
  function add(p) {
    if (!p || seen[p.id]) return;
    seen[p.id] = true;
    out.push({ id: p.id, name: p.name });
  }
  (pv.stream || []).forEach(add);
  (pv.free || []).forEach(add);
  (pv.ads || []).forEach(add);
  myServices().forEach(add);
  add(current);
  return out;
}

function platformSelectHtml(id, options, currentId, onchange) {
  let h = '<select class="input" id="' + id + '" onchange="' + onchange + '">';
  h += '<option value=""' + (!currentId ? ' selected' : '') + '>Not sure yet</option>';
  options.forEach(o => {
    h += '<option value="' + o.id + '"' + (String(o.id) === String(currentId) ? ' selected' : '') + '>' + esc(o.name) + '</option>';
  });
  h += '</select>';
  return h;
}

function statusSelectHtml(id, mediaType, current, onchange) {
  let h = '<select class="input" id="' + id + '" onchange="' + onchange + '">';
  (STATUS[mediaType] || []).forEach(s => {
    h += '<option value="' + s.id + '"' + (s.id === current ? ' selected' : '') + '>' + s.label + '</option>';
  });
  h += '</select>';
  return h;
}

const OFFSET_OPTIONS = [
  { v: '0', label: 'Same day it airs' },
  { v: '1', label: '1 day later' },
  { v: '2', label: '2 days later' },
  { v: '3', label: '3 days later' },
  { v: '7', label: '1 week later' },
  { v: 'hide', label: 'Don\'t show on calendar' }
];

function calendarSettingHtml(it, pid) {
  const cur = it.hideFromCalendar ? 'hide' : String(parseFloat(it.dayOffset) || 0);
  const tm = it.tvmaze;
  const airsOn = tm ? (tm.network || tm.webChannel) : null;
  let h = '<div class="cal-setting"><label for="off_' + pid + '">On my calendar</label>';
  h += '<select class="input" id="off_' + pid + '" onchange="setItemOffset(\'' + pid + '\', this.value)">';
  OFFSET_OPTIONS.forEach(o => {
    h += '<option value="' + o.v + '"' + (o.v === cur ? ' selected' : '') + '>' + esc(o.label) + '</option>';
  });
  h += '</select><div class="hint">';
  if (!it.tvmazeChecked) h += 'Looking up this show\'s schedule…';
  else if (!tm) h += 'No schedule found for this show, so it won\'t appear on the calendar.';
  else {
    h += 'Schedule from TVmaze: ' + esc(tm.name) + (airsOn ? ' on ' + esc(airsOn) : '') + '.';
    if (tm.network && it.platform && it.platform.name && it.platform.name !== tm.network) {
      h += ' If ' + esc(it.platform.name) + ' posts episodes the day after they air, choose 1 day later.';
    }
  }
  h += '</div></div>';
  return h;
}

function ctxItem() {
  const m = S.modal;
  if (!m || !m.ctxPid) return null;
  return findItem(m.ctxPid, m.key);
}
function myPeopleDoc() {
  const m = S.modal;
  return (m && m.people && S.user) ? (m.people[S.user.uid] || {}) : {};
}
function otherPeople() {
  const m = S.modal;
  if (!m || !m.people || !S.user) return [];
  return Object.keys(m.people).filter(uid => uid !== S.user.uid).map(uid => Object.assign({ uid: uid }, m.people[uid]));
}
function draftOr(k, fallback) {
  const d = S.modal.drafts || {};
  return Object.prototype.hasOwnProperty.call(d, k) ? d[k] : (fallback || '');
}

function starsHtml(current) {
  let h = '<div class="stars" role="group" aria-label="Your rating">';
  for (let i = 1; i <= 5; i++) {
    const on = current && i <= current;
    h += '<button type="button" class="star' + (on ? ' on' : '') + '" aria-label="' + i + (i === 1 ? ' star' : ' stars') + '" aria-pressed="' + (current === i) + '" onclick="setMyRating(' + i + ')">' + (on ? '&#9733;' : '&#9734;') + '</button>';
  }
  h += '</div>';
  return h;
}

function noteEditorHtml(draftKey, stored, placeholder, saveCall) {
  const id = 'note_' + draftKey;
  const val = draftOr(draftKey, stored);
  const dirty = val !== (stored || '');
  let h = '<textarea class="input note" id="' + esc(id) + '" rows="3" placeholder="' + esc(placeholder) + '" oninput="setDraft(\'' + draftKey + '\', this.value)">' + esc(val) + '</textarea>';
  h += '<div class="note-actions"><button class="btn small" onclick="' + saveCall + '"' + (dirty ? '' : ' disabled') + ' id="save_' + esc(draftKey) + '">Save note</button></div>';
  return h;
}

function othersNotesHtml(getter) {
  let h = '';
  otherPeople().forEach(p => {
    const n = getter(p);
    if (n) h += '<div class="other-note"><strong>' + esc(p.name || 'Someone') + ':</strong> ' + esc(n) + '</div>';
  });
  return h;
}

function trackingSwitcherHtml(mem) {
  if (mem.length < 2) return '';
  let h = '<div class="choice-row" style="margin-bottom:12px">';
  mem.forEach(x => {
    const on = S.modal.ctxPid === x.playlist.id;
    h += '<button type="button" class="choice' + (on ? ' on' : '') + '" onclick="setCtx(\'' + x.playlist.id + '\')"><span class="dot" style="background:' + esc(x.playlist.color || '#4CAF50') + '"></span>' + esc(x.playlist.name) + '</button>';
  });
  h += '</div>';
  return h;
}

function episodeOverview(ep) {
  return ep && ep.overview ? ep.overview : 'No synopsis yet. These usually appear a day or two after an episode airs.';
}

function tvProgressHtml(d, item) {
  const m = S.modal;
  const pr = progressOf(item);
  let h = '';
  if (pr.aired) {
    const pct = Math.round((pr.watched / pr.aired) * 100);
    h += '<div class="progress big" aria-hidden="true"><span style="width:' + pct + '%"></span></div>';
    h += '<div class="small muted" style="margin-bottom:12px">' + (pr.watched >= pr.aired ? 'Caught up on all ' + pr.aired + ' aired episodes' : pr.watched + ' of ' + pr.aired + ' aired episodes watched') + '</div>';
  }

  const prevK = previousKey(item);
  if (prevK) {
    const ep = findEpisode(d.tmdbId, prevK);
    h += '<div class="recap"><div class="recap-label">Previously on ' + esc(d.title) + '</div>';
    h += '<h3>' + esc(epLabel(prevK)) + (ep && ep.name ? ': ' + esc(ep.name) : '') + '</h3>';
    h += ep ? '<p class="small">' + esc(episodeOverview(ep)) + '</p>' : '<p class="small muted">Loading…</p>';
    h += '</div>';
  }

  const nextK = nextUpKey(item);
  if (nextK) {
    const ep = findEpisode(d.tmdbId, nextK);
    h += '<div class="upnext"><div><div class="recap-label">Up next</div>';
    h += '<h3>' + esc(epLabel(nextK)) + (ep && ep.name ? ': ' + esc(ep.name) : '') + '</h3></div>';
    h += '<button class="btn small" onclick="toggleEp(\'' + nextK + '\')">Mark watched</button></div>';
  } else if (item.nextAir) {
    h += '<div class="upnext"><div><div class="recap-label">Next episode</div>';
    h += '<h3>' + esc(epLabel(epKey(item.nextAir.s, item.nextAir.e))) + (item.nextAir.name ? ': ' + esc(item.nextAir.name) : '') + '</h3>';
    if (item.nextAir.date) h += '<div class="small muted">Airs ' + esc(fmtDate(item.nextAir.date)) + '</div>';
    h += '</div></div>';
  }
  return h;
}

function episodesHtml(d, item) {
  const m = S.modal;
  const seasons = d.seasonList || [];
  if (!seasons.length) return '';
  const sn = m.season || seasons[0].number;
  const me = myPeopleDoc();
  let h = '<div class="section"><h3>Episodes</h3>';
  h += '<div class="season-tabs" role="tablist">';
  seasons.forEach(se => {
    h += '<button type="button" class="' + (se.number === sn ? 'on' : '') + '" onclick="setSeason(' + se.number + ')">S' + se.number + '</button>';
  });
  h += '</div>';

  const cache = S.seasonCache[seasonCacheKey(d.tmdbId, sn)];
  if (!cache || cache.loading) return h + '<div class="loading" style="min-height:120px"><div class="spinner" aria-label="Loading episodes"></div></div></div>';
  if (cache.error) return h + '<div class="msg error" role="alert">Couldn\'t load episodes: ' + esc(cache.error) + '</div></div>';

  const today = todayIso();
  const eps = cache.episodes;
  const airedInSeason = eps.filter(ep => ep.airDate && ep.airDate <= today);
  const allWatched = airedInSeason.length && airedInSeason.every(ep => isWatched(item, epKey(sn, ep.e)));

  // Season note + mark season
  const seasonNote = me.seasons && me.seasons[sn] ? me.seasons[sn].note : '';
  h += '<div class="season-bar">';
  if (airedInSeason.length && !allWatched) h += '<button class="link-btn" onclick="markSeason(' + sn + ')">Mark season ' + sn + ' watched</button>';
  h += '<button class="link-btn" onclick="toggleSeasonNote()">' + (m.seasonNoteOpen ? 'Hide season note' : (seasonNote ? 'Season note' : 'Add season note')) + '</button>';
  h += '</div>';
  if (m.seasonNoteOpen) {
    h += '<div class="note-box">' + noteEditorHtml('season_' + sn, seasonNote, 'Thoughts on season ' + sn + '…', 'saveNote(\'season\', \'' + sn + '\')');
    h += othersNotesHtml(p => p.seasons && p.seasons[sn] ? p.seasons[sn].note : '') + '</div>';
  }

  h += '<div class="eps">';
  eps.forEach(ep => {
    const k = epKey(sn, ep.e);
    const watched = isWatched(item, k);
    const future = !ep.airDate || ep.airDate > today;
    const open = m.openEp === k;
    const myNote = me.episodes && me.episodes[k] ? me.episodes[k].note : '';
    const hasOtherNote = otherPeople().some(p => p.episodes && p.episodes[k] && p.episodes[k].note);
    h += '<div class="ep' + (watched ? ' done' : '') + (open ? ' open' : '') + '">';
    h += '<div class="ep-row">';
    h += '<button type="button" class="check' + (watched ? ' on' : '') + '" aria-label="' + (watched ? 'Mark unwatched' : 'Mark watched') + ': ' + esc(epLabel(k)) + '"' + (future ? ' disabled' : '') + ' onclick="toggleEp(\'' + k + '\')">' + (watched ? '&#10003;' : '') + '</button>';
    h += '<button type="button" class="ep-title" onclick="toggleEpOpen(\'' + k + '\')" aria-expanded="' + open + '">';
    h += '<span class="ep-num">E' + ep.e + '</span> ' + esc(ep.name || 'Episode ' + ep.e);
    if (myNote || hasOtherNote) h += ' <span class="note-dot" title="Has notes"></span>';
    h += '<span class="ep-date">' + (ep.airDate ? (future ? 'Airs ' : '') + esc(fmtDate(ep.airDate)) : 'Date TBA') + '</span>';
    h += '</button></div>';
    if (open) {
      h += '<div class="ep-body"><p class="small">' + esc(episodeOverview(ep)) + '</p>';
      if (!future && !watched) h += '<button class="link-btn small" style="margin-bottom:10px" onclick="markThrough(\'' + k + '\')">Mark all watched through ' + esc(epLabel(k)) + '</button>';
      h += noteEditorHtml('ep_' + k, myNote, 'Your notes on this episode…', 'saveNote(\'episode\', \'' + k + '\')');
      h += othersNotesHtml(p => p.episodes && p.episodes[k] ? p.episodes[k].note : '');
      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

function myTakeHtml(d) {
  const me = myPeopleDoc();
  const show = me.show || {};
  let h = '<div class="section"><h3>Your take</h3>';
  h += starsHtml(show.rating || 0);
  h += noteEditorHtml('show', show.note || '', 'Your notes on ' + d.title + '…', 'saveNote(\'show\', \'\')');
  const others = otherPeople().filter(p => p.show && (p.show.rating || p.show.note));
  others.forEach(p => {
    h += '<div class="other-note"><strong>' + esc(p.name || 'Someone') + ':</strong> ';
    if (p.show.rating) h += '<span class="stars-static">' + '&#9733;'.repeat(p.show.rating) + '</span> ';
    if (p.show.note) h += esc(p.show.note);
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function movieWatchesHtml(item) {
  const dates = (Array.isArray(item.watchDates) ? item.watchDates.slice() : []).sort().reverse();
  let h = '<div class="section"><h3>Watch history</h3>';
  if (dates.length) {
    h += '<div class="watch-list">';
    dates.forEach(dt => {
      h += '<div class="watch-row"><span>' + esc(fmtDate(dt)) + '</span><button class="remove-btn" style="margin:0" onclick="removeWatch(\'' + esc(dt) + '\')">Remove</button></div>';
    });
    h += '</div>';
  } else {
    h += '<p class="small muted">Log each time you watch it, including rewatches.</p>';
  }
  h += '<div class="log-row"><input class="input" type="date" id="watchDate" value="' + todayIso() + '" max="' + todayIso() + '" aria-label="Date watched">';
  h += '<button class="btn small" onclick="logWatch()">Log a watch</button></div>';
  h += '</div>';
  return h;
}

function viewDetailModal() {
  const m = S.modal;
  let h = sheetTop('', false);
  if (m.error) return h + '<div class="msg error" role="alert">' + esc(m.error) + '</div>';
  const d = m.data;
  if (!d) return h + '<div class="loading" style="min-height:220px"><div class="spinner" aria-label="Loading"></div></div>';

  const meta = [];
  meta.push(d.mediaType === 'tv' ? 'TV' : 'Movie');
  if (d.year) meta.push(d.year);
  if (d.mediaType === 'tv' && d.seasons) meta.push(d.seasons + (d.seasons === 1 ? ' season' : ' seasons'));
  if (d.runtime) meta.push(d.runtime + ' min');

  h += '<div class="d-hero">' + posterHtml(d.posterPath, d.title, false) + '<div>';
  h += '<h2>' + esc(d.title) + '</h2>';
  h += '<div class="d-meta">' + esc(meta.join(', ')) + '</div>';
  if (d.genres && d.genres.length) h += '<div class="d-meta">' + esc(d.genres.slice(0, 3).join(', ')) + '</div>';
  if (d.mediaType === 'tv' && d.networks && d.networks.length) h += '<div class="d-meta">' + esc(d.networks.join(', ')) + (d.status ? ' (' + esc(d.status) + ')' : '') + '</div>';
  if (d.mediaType === 'movie' && d.releases) {
    if (d.releases.theatrical) h += '<div class="d-meta">In theaters ' + esc(fmtDate(d.releases.theatrical)) + '</div>';
    if (d.releases.digital) h += '<div class="d-meta">Digital release ' + esc(fmtDate(d.releases.digital)) + '</div>';
  }
  h += '</div></div>';
  if (d.overview) h += '<p class="d-overview">' + esc(d.overview) + '</p>';
  if (m.error2) h += '<div class="msg error" role="alert">' + esc(m.error2) + '</div>';

  const mem = memberships(m.key);
  const item = ctxItem();

  // Progress / recap (TV) before list management, since it's what you open the sheet for
  if (item && d.mediaType === 'tv') {
    h += '<div class="section"><h3>Your progress</h3>' + trackingSwitcherHtml(mem) + tvProgressHtml(d, item) + '</div>';
  }

  // In your lists
  const available = S.playlists.filter(pl => !mem.some(x => x.playlist.id === pl.id));
  h += '<div class="section"><h3>' + (mem.length ? 'In your lists' : 'Add to a list') + '</h3>';
  mem.forEach(x => {
    const it = x.item, pl = x.playlist;
    const pid = pl.id;
    h += '<div class="inlist"><div class="top"><span class="dot" style="background:' + esc(pl.color || '#4CAF50') + '"></span>' + esc(pl.name) + '</div>';
    h += '<div class="grid2"><div><label for="st_' + pid + '">Status</label>';
    h += statusSelectHtml('st_' + pid, d.mediaType, it.status, 'setItemStatus(\'' + pid + '\', this.value)') + '</div>';
    h += '<div><label for="pf_' + pid + '">Where I watch</label>';
    h += platformSelectHtml('pf_' + pid, platformOptions(d, it.platform), it.platform ? it.platform.id : '', 'setItemPlatform(\'' + pid + '\', this.value)') + '</div></div>';
    if (d.mediaType === 'tv') h += calendarSettingHtml(it, pid);
    h += '<button class="remove-btn" onclick="removeItem(\'' + pid + '\')">Remove from ' + esc(pl.name) + '</button></div>';
  });
  if (available.length) {
    h += '<button class="btn block" style="margin-top:' + (mem.length ? '6px' : '0') + '" onclick="showAdd()">' + (mem.length ? 'Add to another list' : 'Add to a list') + '</button>';
  }
  h += '</div>';

  if (item) {
    if (d.mediaType === 'movie') {
      if (mem.length > 1) h += '<div class="section"><h3>Tracking in</h3>' + trackingSwitcherHtml(mem) + '</div>';
      h += movieWatchesHtml(item);
    }
    h += myTakeHtml(d);
    if (d.mediaType === 'tv') h += episodesHtml(d, item);
  }

  h += whereToWatchHtml(d);
  return h;
}

function viewAddModal() {
  const m = S.modal;
  const d = m.data;
  const f = m.form;
  const mem = memberships(m.key);
  const available = S.playlists.filter(pl => !mem.some(x => x.playlist.id === pl.id));

const POPULAR_COUNT = 20;

function isSelected(id) {
  return S.modal.selected.some(x => String(x) === String(id));
}

function servicesGridHtml() {
  const m = S.modal;
  if (m.error) return '<div class="msg error" role="alert">' + esc(m.error) + '</div>';
  if (!S.providerCatalog) return '<div class="loading" style="min-height:160px"><div class="spinner" aria-label="Loading"></div></div>';
  const f = (m.filter || '').trim().toLowerCase();
  let list;
  let note = '';
  if (f) {
    // Searching looks through every service
    list = S.providerCatalog.filter(p => p.name.toLowerCase().indexOf(f) !== -1);
    if (!list.length) return '<p class="muted small" style="margin-top:12px">No services match "' + esc(m.filter) + '".</p>';
  } else {
    // Default view: the most popular services, plus anything already selected
    list = S.providerCatalog.slice(0, POPULAR_COUNT);
    S.providerCatalog.slice(POPULAR_COUNT).forEach(p => {
      if (isSelected(p.id)) list.push(p);
    });
    note = '<p class="muted small" style="margin:12px 0 0">Showing the most popular services. Search to find others.</p>';
  }
  let h = note + '<div class="svc-grid">';
  list.forEach(p => {
    const on = isSelected(p.id);
    h += '<button type="button" class="svc' + (on ? ' on' : '') + '" aria-pressed="' + (on ? 'true' : 'false') + '" data-id="' + esc(p.id) + '" onclick="toggleService(this.getAttribute(\'data-id\'))">';
    h += p.logoPath ? '<img loading="lazy" src="' + LOGO_BASE + esc(p.logoPath) + '" alt="">' : '';
    h += '<span>' + esc(p.name) + '</span></button>';
  });
  h += '</div>';
  return h;
}

function renderModal() {
  const root = document.getElementById('modal');
  const m = S.modal;
  if (!m) {
    root.innerHTML = '';
    document.body.style.overflow = '';
    return;
  }
  let inner = '';
  if (m.view === 'detail') inner = viewDetailModal();
  else if (m.view === 'add') inner = viewAddModal();
  else if (m.view === 'services') inner = viewServicesModal();
  else if (m.view === 'newList') inner = viewNewListModal();
  else if (m.view === 'playlist') inner = viewPlaylistModal();
  // Keep the scroll position when re-rendering the same view (e.g. after a live update)
  const sheet = root.querySelector('.sheet');
  const sameView = sheet && sheet.getAttribute('data-view') === m.view + ':' + (m.key || '');
  const scrollTop = sheet ? sheet.scrollTop : 0;
  // Remember what's focused (e.g. a note being typed) so live updates don't interrupt typing
  const ae = document.activeElement;
  const focusId = (ae && ae.id && root.contains(ae)) ? ae.id : null;
  let selStart = null, selEnd = null;
  try {
    if (focusId && ae.selectionStart != null) { selStart = ae.selectionStart; selEnd = ae.selectionEnd; }
  } catch (e) { /* date/select inputs have no text selection */ }
  root.innerHTML = '<div class="overlay" onclick="if (event.target === this) closeModal()"><div class="sheet" role="dialog" aria-modal="true" data-view="' + esc(m.view + ':' + (m.key || '')) + '">' + inner + '</div></div>';
  document.body.style.overflow = 'hidden';
  const newSheet = root.querySelector('.sheet');
  if (newSheet && sameView) newSheet.scrollTop = scrollTop;
  if (focusId && sameView) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus({ preventScroll: true });
      if (selStart != null && typeof el.setSelectionRange === 'function') {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text field */ }
      }
    }
  }
}

  S.busy = true;
  S.busyLabel = 'Checking username…';
  render();
  const uid = S.user.uid;
  try {
    const taken = await step('check username', getDoc(doc(db, 'usernames', username)));

    S.busyLabel = 'Saving profile…';
    render();

    const plRef = doc(collection(db, 'playlists'));
    const batch = writeBatch(db);
    batch.set(doc(db, 'usernames', username), { uid: uid }, { merge: true });
    batch.set(doc(db, 'profiles', uid), {

      createdAt: serverTimestamp()
    }, { merge: true });

      email: S.user.email,
      personalPlaylistId: plRef.id,
      services: [],

    }, { merge: true });

    await loadAccount();
    S.busy = false;
    S.busyLabel = '';
    S.screen = 'app';
    S.tab = 'home';
    render();

  } catch (e) {
    S.busy = false;
    S.busyLabel = '';
    if (e.message === 'taken') {
      S.error = '@' + username + ' is taken. Try another username.';
    } else {
      S.error = 'Couldn\'t save your profile. ' + (e.code ? '[' + e.code + '] ' : '') + (e.message || 'Unknown error');

    render();
    const nameEl = document.getElementById('obName');

// Status to set after marking episodes: start "Watching", or "Finished" when an ended show is complete
function statusAfterWatching(item, newlyWatched) {
  const keys = airedKeys(item);
  const done = keys.length && keys.every(k => isWatched(item, k) || newlyWatched.indexOf(k) !== -1);
  const ended = /ended|canceled|cancelled/i.test(item.showStatus || '');
  if (done && ended) return 'finished';
  if (item.status === 'want') return 'watching';
  return null;
}

async function markEpisodes(keys) {
  const m = S.modal;
  const item = ctxItem();
  if (!item || !keys.length) return;
  const watched = {};
  keys.forEach(k => { watched[k] = serverTimestamp(); });
  const fields = { watched: watched, updatedAt: serverTimestamp() };
  const next = statusAfterWatching(item, keys);
  if (next && next !== item.status) fields.status = next;
  try {
    await setDoc(itemRef(), fields, { merge: true });
  } catch (e) {
    m.error2 = 'Couldn\'t save progress: ' + e.message;
    renderModal();
  }
}

window.toggleEp = async function (k) {
  const m = S.modal;
  const item = ctxItem();
  if (!item) return;
  if (isWatched(item, k)) {
    try {
      const w = {};
      w[k] = deleteField();
      await setDoc(itemRef(), { watched: w, updatedAt: serverTimestamp() }, { merge: true });
    } catch (e) {
      m.error2 = 'Couldn\'t save progress: ' + e.message;
      renderModal();
    }
  } else {
    await markEpisodes([k]);
  }
};

window.markThrough = function (k) {
  const item = ctxItem();
  const keys = airedKeys(item);
  const idx = keys.indexOf(k);
  if (idx === -1) return;
  const todo = keys.slice(0, idx + 1).filter(x => !isWatched(item, x));
  if (todo.length > 1 && !confirm('Mark ' + todo.length + ' episodes as watched?')) return;
  markEpisodes(todo);
};

window.markSeason = function (sn) {
  const item = ctxItem();
  const todo = airedKeys(item).filter(k => parseEpKey(k).s === sn && !isWatched(item, k));
  if (!todo.length) return;
  if (!confirm('Mark ' + todo.length + ' episodes in season ' + sn + ' as watched?')) return;
  markEpisodes(todo);
};

let peopleSearchSeq = 0;
async function runPeopleSearch() {
  const m = S.modal;
  if (!m || m.view !== 'playlist') return;
  const q = String(m.q || '').trim().toLowerCase().replace(/^@/, '');
  const box = () => document.getElementById('peopleResults');
  if (q.length < 2) {
    m.results = [];
    if (box()) box().innerHTML = peopleResultsHtml();
    return;
  }
  const seq = ++peopleSearchSeq;
  m.searching = true;
  m.searchError = '';
  if (box()) box().innerHTML = peopleResultsHtml();
  try {
    const col = collection(db, 'profiles');
    const [byUser, byName] = await Promise.all([
      getDocs(query(col, orderBy('username'), startAt(q), endAt(q + '\uf8ff'), limit(10))),
      getDocs(query(col, orderBy('displayNameLower'), startAt(q), endAt(q + '\uf8ff'), limit(10)))
    ]);
    if (seq !== peopleSearchSeq || S.modal !== m) return;
    const found = {};
    byUser.docs.concat(byName.docs).forEach(d => {
      const p = d.data();
      if (d.id === S.user.uid || p.discoverable !== true) return;
      found[d.id] = { uid: d.id, displayName: p.displayName || p.username, username: p.username };
      S.profileCache[d.id] = p;
    });
    m.results = Object.keys(found).map(k => found[k]).sort((a, b) => a.displayName.localeCompare(b.displayName));
  } catch (e) {
    if (seq !== peopleSearchSeq) return;
    m.searchError = 'Search failed: ' + e.message;
  }
  m.searching = false;
  if (box()) box().innerHTML = peopleResultsHtml();
}

window.sendInvite = async function (toUid) {
  const m = S.modal;
  const pl = S.playlists.find(p => p.id === m.pid);
  const to = S.profileCache[toUid] || {};
  if (!pl) return;
  m.inviting = toUid;
  m.error = '';
  const box = document.getElementById('peopleResults');
  if (box) box.innerHTML = peopleResultsHtml();
  try {
    await step('send invite', setDoc(doc(db, 'invites', pl.id + '_' + toUid), {
      playlistId: pl.id,
      playlistName: pl.name,
      playlistColor: pl.color || '#7C3AED',
      fromUid: S.user.uid,
      fromName: (S.profile && S.profile.displayName) || '',
      fromUsername: (S.profile && S.profile.username) || '',
      toUid: toUid,
      toName: to.displayName || '',
      toUsername: to.username || '',
      status: 'pending',
      createdAt: serverTimestamp()
    }, { merge: true }));
    m.notice = 'Invite sent to ' + (to.displayName || 'them') + '.';
    const existing = (m.sent || []).find(x => x.toUid === toUid && x.playlistId === pl.id);
    if (existing) existing.status = 'pending';
    else m.sent.push({ playlistId: pl.id, toUid: toUid, toName: to.displayName, toUsername: to.username, status: 'pending' });
  } catch (e) {
    m.error = 'Couldn\'t send the invite. ' + (e.code === 'permission-denied' ? 'They may have turned off "Let people find me."' : e.message);
  }
  m.inviting = null;
  renderModal();
};

window.answerInvite = async function (inviteId, accept) {
  const inv = S.invites.find(x => x.id === inviteId);
  if (!inv) return;
  S.error = '';
  S.notice = '';
  try {
    const batch = writeBatch(db);
    batch.set(doc(db, 'invites', inviteId), { status: accept ? 'accepted' : 'declined', respondedAt: serverTimestamp() }, { merge: true });
    if (accept) batch.set(doc(db, 'playlists', inv.playlistId), { memberUids: arrayUnion(S.user.uid) }, { merge: true });
    await step(accept ? 'join list' : 'decline invite', batch.commit());
    if (accept) S.notice = 'You joined ' + (inv.playlistName || 'the list') + '.';
  } catch (e) {
    S.error = 'Couldn\'t ' + (accept ? 'join' : 'decline') + ': ' + e.message;
  }
  render();
};

window.removeMember = async function (uid) {
  const m = S.modal;
  if (!confirm('Remove ' + memberName(uid) + ' from this list?')) return;
  try {
    await setDoc(doc(db, 'playlists', m.pid), { memberUids: arrayRemove(uid), updatedAt: serverTimestamp() }, { merge: true });
  } catch (e) {
    m.error = 'Couldn\'t remove them: ' + e.message;
    renderModal();
  }
};

window.leaveList = async function () {
  const m = S.modal;
  const pl = S.playlists.find(p => p.id === m.pid);
  if (!confirm('Leave ' + (pl ? pl.name : 'this list') + '? It will disappear from your Library and calendar.')) return;
  try {
    await setDoc(doc(db, 'playlists', m.pid), { memberUids: arrayRemove(S.user.uid), updatedAt: serverTimestamp() }, { merge: true });
    S.modal = null;
    renderModal();
  } catch (e) {
    m.error = 'Couldn\'t leave the list: ' + e.message;
    renderModal();
  }
};

window.deleteList = async function () {
  const m = S.modal;
  const pl = S.playlists.find(p => p.id === m.pid);
  if (!pl || !confirm('Delete ' + pl.name + ' for everyone? Its titles and progress will be removed.')) return;
  try {
    const items = await getDocs(collection(db, 'playlists', pl.id, 'items'));
    const batch = writeBatch(db);
    items.docs.slice(0, 450).forEach(d => batch.delete(d.ref));
    batch.delete(doc(db, 'playlists', pl.id));
    await step('delete list', batch.commit());
    S.modal = null;
    renderModal();
  } catch (e) {
    m.error = 'Couldn\'t delete the list: ' + e.message;
    renderModal();
  }
};

// ----- Library filters -----
window.setLibFilter = function (name, value) {
  S.lib[name] = value;
  // A status that doesn't exist for the chosen type would hide everything
  if (name === 'type' && S.lib.status !== 'all' && !libStatusOptions().some(o => o.id === S.lib.status)) S.lib.status = 'all';
  saveLibFilter();
  render();
};

window.clearLibFilters = function () {
  S.lib = { type: 'all', status: 'all', platform: 'all' };
  saveLibFilter();
  render();
};

// ----- Add -----
function defaultPlatformId(d) {
  const mine = myServiceIds();
  const pv = d.providers || {};
  const streamable = (pv.stream || []).concat(pv.free || [], pv.ads || []);
  const onMine = streamable.find(p => mine.indexOf(String(p.id)) !== -1);
  if (onMine) return String(onMine.id);
  return streamable.length ? String(streamable[0].id) : '';
}

window.showAdd = function () {
  const m = S.modal;
  if (!m || !m.data) return;
  const mem = memberships(m.key);
  const available = S.playlists.filter(pl => !mem.some(x => x.playlist.id === pl.id));
  m.view = 'add';
  m.error2 = '';
  m.saving = false;
  m.form = {
    pid: available.length ? available[0].id : '',
    status: m.data.mediaType === 'tv' ? 'watching' : 'want',
    platformId: defaultPlatformId(m.data)
  };
  renderModal();
};

window.setAddField = function (name, value, noRender) {
  if (!S.modal || !S.modal.form) return;
  S.modal.form[name] = value;
  if (!noRender) renderModal();
};

window.saveAdd = async function () {
  const m = S.modal;
  if (!m || !m.form || !m.form.pid) return;
  const d = m.data;
  const f = m.form;
  const opts = platformOptions(d, null);
  const p = opts.find(o => String(o.id) === String(f.platformId));
  const item = {
    tmdbId: d.tmdbId,
    mediaType: d.mediaType,
    title: d.title,
    year: d.year || '',
    posterPath: d.posterPath || null,
    genres: d.genres || [],
    imdbId: d.imdbId || null,
    tvdbId: d.tvdbId || null,
    status: f.status,
    platform: p ? { id: p.id, name: p.name } : null,
    addedBy: S.user.uid,
    addedAt: serverTimestamp(),
    updatedAt: serverTimestamp(),
    lastRefreshed: serverTimestamp()
  };
  if (d.mediaType === 'tv') {
    item.dayOffset = 0;
    item.watched = {};
    Object.assign(item, tvMeta(d));
  } else {
    item.watchDates = [];
    item.releases = d.releases || null;
  }
  m.saving = true;
  renderModal();
  try {
    await step('add item', setDoc(doc(db, 'playlists', f.pid, 'items', m.key), item, { merge: true }));
    if (S.modal === m) {
      m.view = 'detail';
      m.saving = false;
      m.ctxPid = f.pid;
      ensureCtx();
      renderModal();
    }
  } catch (e) {
    m.saving = false;
    m.error2 = 'Couldn\'t add it: ' + (e.code ? '[' + e.code + '] ' : '') + e.message;
    renderModal();
  }
};

// ----- My services -----
window.openServices = async function () {
  // Service ids are brand keys like 'paramount-plus'; drop any older numeric ids
  S.modal = { view: 'services', selected: myServiceIds().filter(id => isNaN(parseFloat(id))), filter: '', error: '' };
  renderModal();
  if (S.providerCatalog) return;
  try {
    const data = await api('providers', {});
    S.providerCatalog = data.providers || [];
  } catch (e) {
    if (S.modal && S.modal.view === 'services') S.modal.error = 'Couldn\'t load services: ' + e.message;
  }
  if (S.modal && S.modal.view === 'services') renderModal();
};

window.toggleService = function (id) {
  const m = S.modal;
  if (!m || m.view !== 'services') return;
  // Compare as strings so ids work whether they arrive as numbers or brand keys
  const i = m.selected.findIndex(x => String(x) === String(id));
  if (i === -1) m.selected.push(String(id)); else m.selected.splice(i, 1);
  renderModal();
};

window.filterServices = function (v) {
  S.modal.filter = v;
  const grid = document.getElementById('svcGrid');
  if (grid) grid.innerHTML = servicesGridHtml();
};

window.saveServices = async function () {
  const m = S.modal;
  const catalog = S.providerCatalog || [];
  const prior = myServices();
  const services = m.selected.map(id => {
    const p = catalog.find(x => String(x.id) === String(id)) || prior.find(x => String(x.id) === String(id));
    return p ? { id: p.id, name: p.name, logoPath: p.logoPath || null } : null;
  }).filter(Boolean);
  m.saving = true;
  renderModal();
  try {
    await step('save services', setDoc(doc(db, 'users', S.user.uid), { services: services }, { merge: true }));
    S.userDoc = Object.assign({}, S.userDoc || {}, { services: services });
    S.modal = null;
    renderModal();
    render();
  } catch (e) {
    m.saving = false;
    m.error = 'Couldn\'t save your services: ' + e.message;
    renderModal();
  }
};

window.toggleDiscoverable = async function () {
  const next = !(S.profile && S.profile.discoverable);
  S.profile.discoverable = next;
  render();
  try {
    await setDoc(doc(db, 'profiles', S.user.uid), { discoverable: next }, { merge: true });
  } catch (e) {
    S.profile.discoverable = !next;
    S.error = 'Couldn\'t save that setting: ' + e.message;
    render();
  }
};

window.resendVerification = async function () {
  S.error = '';
  S.notice = '';
  try {
    await sendVerificationEmail();
    S.notice = 'Verification email sent to ' + auth.currentUser.email + '.';
  } catch (e) {
    S.error = authErrorText(e);
  }
  render();
};

window.refreshVerification = async function () {
  S.error = '';
  S.notice = '';
  try {
    await auth.currentUser.reload();
    await auth.currentUser.getIdToken(true);
    S.user = auth.currentUser;
    if (!S.user.emailVerified) S.notice = 'Not verified yet. Open the link in the email, then try again.';
  } catch (e) {
    S.error = e.message;
  }
  render();
};

window.doSignOut = async function () {
  S.modal = null;
  renderModal();
  stopListeners();
  await signOut(auth);
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.modal) window.closeModal();
});

// ---------- Boot ----------
render();
if (S.emailAction) startEmailAction();

onAuthStateChanged(auth, async (user) => {
  S.user = user;
  S.error = '';
  S.notice = '';
  // Each screen starts un-busy; the login/signup button's busy state must not carry over
  S.busy = false;
  S.busyLabel = '';
  if (!user) {
    stopListeners();
    S.profile = null;
    S.userDoc = null;
    S.personal = null;
    S.modal = null;
    S.detailCache = {};
    S.seasonCache = {};
    S.tvm = {};
    S.tvmLoading = {};
    S.calError = '';
    S.linking = false;
    S.weekOffset = 0;
    S.profileCache = {};
    S.recs = { items: [], generatedAtMs: 0, loading: false, error: '', checked: false };
    S.search = { q: '', results: [], loading: false, error: '', done: false, reqId: 0 };
    S.screen = 'auth';
    renderModal();
    render();
    return;
  }
  S.screen = 'loading';
  render();
  try {
    await loadAccount();
    try { sessionStorage.removeItem('ww_reloaded'); } catch (e) { /* ignore */ }
  } catch (e) {
    // Safety net: a stuck connection clears up with a fresh page load, so try that once
    let alreadyReloaded = false;
    try { alreadyReloaded = sessionStorage.getItem('ww_reloaded') === '1'; } catch (err) { /* ignore */ }
    if (e.code === 'ww/timeout' && !alreadyReloaded) {
      try { sessionStorage.setItem('ww_reloaded', '1'); } catch (err) { /* ignore */ }
      console.warn('[WW] account load timed out, reloading once');
      window.location.reload();
      return;
    }
    S.error = 'Couldn\'t load your account. ' + (e.code ? '[' + e.code + '] ' : '') + e.message;
  }
  S.screen = S.profile ? 'app' : 'onboarding';
  render();
  if (S.screen === 'app') startListeners();
});
</script>
