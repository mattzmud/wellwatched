<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F6F0">
<title>WellWatched</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F6F0;
    --card: #FFFFFF;
    --green: #4CAF50;
    --green-dark: #3E8E41;
    --purple: #7C3AED;
    --text: #1A1A2E;
    --muted: #6B7280;
    --border: #E5E0D8;
    --danger: #C0392B;
    --r-card: 16px;
    --r-input: 8px;
    --r-modal: 24px;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .brand, label, .btn, .tab-label {
    font-family: 'Nunito', system-ui, sans-serif;
  }
  h1 { font-size: 1.75rem; font-weight: 800; margin: 0 0 4px; }
  h2 { font-size: 1.25rem; font-weight: 800; margin: 0 0 12px; }
  h3 { font-size: 1rem; font-weight: 700; margin: 0; }
  p { margin: 0 0 12px; }
  a { color: var(--purple); }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }

  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 3px solid rgba(124, 58, 237, 0.35);
    outline-offset: 2px;
  }

  /* ---------- Buttons & inputs ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: var(--r-input);
    padding: 12px 18px; font-size: 1rem; font-weight: 700;
    cursor: pointer; background: var(--green); color: #fff;
  }
  .btn:hover { background: var(--green-dark); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn.block { width: 100%; }
  .btn.secondary { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
  .btn.secondary:hover { background: #fff; }
  .btn.purple { background: var(--purple); }
  .btn.small { padding: 8px 12px; font-size: 0.9rem; }
  .link-btn {
    background: none; border: none; padding: 0; color: var(--purple);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  .input {
    width: 100%; padding: 12px 14px; font-size: 1rem; font-family: inherit;
    border: 1.5px solid var(--border); border-radius: var(--r-input);
    background: #fff; color: var(--text);
  }
  .input:focus { border-color: var(--purple); outline: none; }
  .hint { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
  .msg { padding: 10px 14px; border-radius: var(--r-input); font-size: 0.9rem; margin-bottom: 16px; }
  .msg.error { background: #FDECEA; color: var(--danger); }
  .msg.notice { background: #EAF6EA; color: #2E6B31; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r-card); padding: 20px;
  }

  /* ---------- Auth & onboarding ---------- */
  .auth-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .auth-box { width: 100%; max-width: 400px; }
  .auth-brand { text-align: center; margin-bottom: 24px; }
  .brand { font-weight: 800; font-size: 1.6rem; letter-spacing: -0.01em; }
  .brand .w2 { color: var(--purple); }
  .auth-tabs { display: flex; gap: 4px; background: #EFEBE3; padding: 4px; border-radius: 10px; margin-bottom: 20px; }
  .auth-tabs button {
    flex: 1; border: none; background: transparent; padding: 10px; border-radius: 8px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.95rem; color: var(--muted); cursor: pointer;
  }
  .auth-tabs button.active { background: #fff; color: var(--text); }
  .auth-foot { text-align: center; margin-top: 16px; font-size: 0.9rem; }

  .loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--green);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

  /* ---------- App shell ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(248, 246, 240, 0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
  }
  .topbar-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .topnav { display: none; gap: 4px; }
  .topnav button {
    border: none; background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.95rem; color: var(--muted);
  }
  .topnav button.active { background: #fff; color: var(--text); box-shadow: 0 0 0 1px var(--border); }

  main {
    max-width: 960px; margin: 0 auto; padding: 20px 16px;
    padding-bottom: calc(var(--nav-h) + 32px + env(safe-area-inset-bottom));
  }

  .bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: #fff; border-top: 1px solid var(--border);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  .bottomnav button {
    flex: 1; height: var(--nav-h); border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--muted);
  }
  .bottomnav button.active { color: var(--green); }
  .bottomnav svg { width: 24px; height: 24px; }
  .tab-label { font-size: 0.72rem; font-weight: 700; }

  @media (min-width: 768px) {
    .topnav { display: flex; }
    .bottomnav { display: none; }
    main { padding: 32px 24px 48px; }
  }

  .banner {
    background: #F3EEFF; border: 1px solid #DDD0FB; color: #4C1D95;
    border-radius: var(--r-input); padding: 10px 14px; margin-bottom: 20px;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 0.9rem;
  }
  .banner .actions { display: flex; gap: 12px; margin-left: auto; }

  .page-head { margin-bottom: 20px; }
  .stack > * + * { margin-top: 16px; }

  /* ---------- Home: week strip ---------- */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
  .day {
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 4px; text-align: center; min-height: 84px;
  }
  .day .dname { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.75rem; color: var(--muted); }
  .day .dnum { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.2rem; }
  .day.today { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .day.today .dname { color: var(--green); }
  @media (max-width: 420px) {
    .day { padding: 8px 2px; min-height: 64px; }
    .day .dnum { font-size: 1rem; }
  }
  .empty { text-align: center; padding: 28px 20px; }
  .empty p { margin: 0 auto 16px; max-width: 34ch; }

  /* ---------- Library ---------- */
  .pl-row { display: flex; align-items: center; gap: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }

  /* ---------- Search ---------- */
  .searchbar { display: flex; gap: 8px; margin-bottom: 20px; }
  .searchbar .input { flex: 1; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
  .result { min-width: 0; }
  .poster {
    width: 100%; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden;
    background: #EFEBE3; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
  }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .ph { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 2rem; color: #C9C1B3; }
  .result h3 { font-size: 0.95rem; margin-top: 8px; line-height: 1.3; }
  .result .meta { font-size: 0.8rem; color: var(--muted); }
  .pill {
    display: inline-block; font-size: 0.7rem; font-weight: 700; font-family: 'Nunito', sans-serif;
    padding: 1px 8px; border-radius: 999px; margin-right: 4px;
  }
  .pill.tv { background: #F3EEFF; color: var(--purple); }
  .pill.movie { background: #EAF6EA; color: #2E6B31; }

  /* ---------- Profile ---------- */
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .toggle {
    position: relative; width: 48px; height: 28px; flex: none; border: none; border-radius: 999px;
    background: #D6D0C4; cursor: pointer; padding: 0;
  }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; transition: left 0.15s;
  }
  .toggle.on { background: var(--green); }
  .toggle.on::after { left: 23px; }
  .credits p { font-size: 0.85rem; color: var(--muted); }

  /* ---------- Phase 1b: tiles, modal, providers ---------- */
  .tile {
    background: none; border: none; padding: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; width: 100%;
    /* Buttons center their content vertically; pin it to the top so posters line up across a row */
    display: flex; flex-direction: column; justify-content: flex-start; align-self: start;
  }
  .tile:hover .poster { border-color: #CFC7B8; }
  .poster { position: relative; }
  .poster .badge {
    position: absolute; top: 6px; right: 6px; background: var(--green); color: #fff;
    border-radius: 999px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 800; box-shadow: 0 0 0 2px #fff;
  }
  .status { display: inline-block; font-size: 0.7rem; font-weight: 700; font-family: 'Nunito', sans-serif; padding: 1px 8px; border-radius: 999px; }
  .status.watching, .status.watched { background: #EAF6EA; color: #2E6B31; }
  .status.want { background: #F3EEFF; color: var(--purple); }
  .status.finished { background: #EEF0F3; color: #4B5563; }
  .status.dropped { background: #F5EFE6; color: #8A7A63; }

  .pl-head { display: flex; align-items: center; gap: 10px; margin: 28px 0 14px; }
  .pl-head:first-of-type { margin-top: 0; }
  .pl-head h2 { margin: 0; }
  .pl-head .count { color: var(--muted); font-size: 0.9rem; }

  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(26, 26, 46, 0.45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    background: var(--card); width: 100%; max-height: 92vh; overflow-y: auto;
    border-radius: var(--r-modal) var(--r-modal) 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    animation: sheetUp 0.22s ease-out;
  }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  @media (min-width: 768px) {
    .overlay { align-items: center; padding: 24px; }
    .sheet { max-width: 600px; border-radius: var(--r-modal); max-height: 88vh; padding: 28px; }
  }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); flex: none;
  }
  .icon-btn svg { width: 18px; height: 18px; }

  .d-hero { display: flex; gap: 16px; margin-bottom: 16px; }
  .d-hero .poster { width: 110px; flex: none; }
  .d-hero h2 { margin: 0 0 4px; font-size: 1.35rem; line-height: 1.2; }
  .d-meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
  .d-overview { font-size: 0.95rem; }
  .section { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
  .section h3 { margin-bottom: 10px; }

  .inlist { background: #FAF8F3; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .inlist .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 700; font-family: 'Nunito', sans-serif; }
  .inlist .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .inlist label { font-size: 0.78rem; margin-bottom: 4px; color: var(--muted); }
  select.input { padding: 10px 12px; appearance: auto; }
  .remove-btn { margin-top: 10px; background: none; border: none; color: var(--danger); font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 0; }

  .prov-group { margin-bottom: 12px; }
  .prov-group .gname { font-size: 0.8rem; font-weight: 700; font-family: 'Nunito', sans-serif; color: var(--muted); margin-bottom: 6px; }
  .prov-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .prov { position: relative; width: 44px; height: 44px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #fff; }
  .prov img { width: 100%; height: 100%; display: block; }
  .prov.mine { box-shadow: 0 0 0 3px var(--green); border-color: var(--green); }
  .mine-note { font-size: 0.85rem; color: #2E6B31; margin: 0 0 10px; font-weight: 600; }
  .attrib { font-size: 0.78rem; color: var(--muted); margin-top: 8px; }

  .choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice {
    border: 1.5px solid var(--border); background: #fff; border-radius: 999px; padding: 8px 14px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.9rem; cursor: pointer; color: var(--text);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .choice.on { border-color: var(--green); background: #EAF6EA; color: #2E6B31; }

  .svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; margin-top: 12px; }
  .svc {
    border: 1.5px solid var(--border); background: #fff; border-radius: 12px; padding: 10px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; color: var(--text);
  }
  .svc img { width: 44px; height: 44px; border-radius: 10px; }
  .svc span { font-size: 0.72rem; line-height: 1.2; text-align: center; }
  .svc.on { border-color: var(--green); background: #EAF6EA; }
  .svc-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .svc-chips img { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .sheet-actions .btn { flex: 1; }

  /* ---------- Phase 1c: library filters, progress, episodes, notes ---------- */
  .lib-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; align-items: center; }
  .lib-filters select.input { width: auto; flex: 1 1 150px; max-width: 220px; }
  .seg { display: flex; background: #EFEBE3; padding: 3px; border-radius: 10px; }
  .seg button {
    border: none; background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.9rem; color: var(--muted);
  }
  .seg button.on { background: #fff; color: var(--text); }
  @media (max-width: 480px) {
    .seg { flex: 1 1 100%; }
    .seg button { flex: 1; }
    .lib-filters select.input { max-width: none; }
  }

  .progress { height: 5px; background: #EFEBE3; border-radius: 999px; overflow: hidden; margin: 6px 0 2px; }
  .progress span { display: block; height: 100%; background: var(--green); border-radius: 999px; }
  .progress.big { height: 8px; margin: 0 0 6px; }

  .recap { background: #F3EEFF; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .recap h3 { margin-bottom: 4px; }
  .recap p { margin: 0; }
  .recap-label { font-size: 0.78rem; font-weight: 700; font-family: 'Nunito', sans-serif; color: var(--purple); margin-bottom: 2px; }
  .upnext {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1.5px solid var(--green); border-radius: 12px; padding: 12px 14px;
  }
  .upnext .recap-label { color: #2E6B31; }

  .stars { display: flex; gap: 2px; margin-bottom: 10px; }
  .star { background: none; border: none; cursor: pointer; font-size: 1.6rem; line-height: 1; color: #D6D0C4; padding: 2px; }
  .star.on { color: #E8A317; }
  .stars-static { color: #E8A317; letter-spacing: 1px; }
  textarea.note { resize: vertical; min-height: 72px; line-height: 1.45; }
  .note-actions { display: flex; justify-content: flex-end; margin: 6px 0 4px; }
  .other-note { font-size: 0.9rem; background: #FAF8F3; border-left: 3px solid var(--purple); padding: 8px 10px; border-radius: 0 8px 8px 0; margin-top: 8px; }

  .season-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .season-tabs button {
    flex: none; border: 1.5px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 12px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.85rem; cursor: pointer; color: var(--text);
  }
  .season-tabs button.on { background: var(--text); border-color: var(--text); color: #fff; }
  .season-bar { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 10px; font-size: 0.9rem; }
  .note-box { background: #FAF8F3; border-radius: 12px; padding: 12px; margin-bottom: 12px; }

  .eps { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .ep + .ep { border-top: 1px solid var(--border); }
  .ep-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .check {
    width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid #CFC7B8; background: #fff;
    color: #fff; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
  }
  .check.on { background: var(--green); border-color: var(--green); }
  .check:disabled { opacity: 0.35; cursor: default; }
  .ep-title {
    flex: 1; min-width: 0; background: none; border: none; padding: 0; text-align: left; cursor: pointer;
    font: inherit; font-size: 0.92rem; color: var(--text); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px;
  }
  .ep.done .ep-title { color: var(--muted); }
  .ep-num { font-family: 'Nunito', sans-serif; font-weight: 800; }
  .ep-date { flex-basis: 100%; font-size: 0.78rem; color: var(--muted); }
  .note-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--purple); display: inline-block; align-self: center; }
  .ep-body { padding: 0 12px 12px 50px; }
  @media (max-width: 420px) { .ep-body { padding-left: 12px; } }

  .watch-list { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; }
  .watch-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; font-size: 0.92rem; }
  .watch-row + .watch-row { border-top: 1px solid var(--border); }
  .log-row { display: flex; gap: 8px; }
  .log-row .input { flex: 1; }

  /* ---------- Phase 2: calendar ---------- */
  .week-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .week-title { flex: 1; text-align: center; }
  .week-title h2 { margin: 0; }
  .icon-btn.flip svg { transform: scaleX(-1); }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .cal-chips { margin-bottom: 14px; }
  .dot.sm { width: 7px; height: 7px; }

  .week .day { cursor: pointer; font: inherit; color: inherit; }
  .week .dcount { display: flex; justify-content: center; gap: 3px; height: 8px; margin-top: 4px; }
  .week .dcount .dot { background: var(--purple); }

  .cal { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .cal-day { background: #fff; border: 1px solid var(--border); border-radius: var(--r-card); padding: 12px; scroll-margin-top: 80px; }
  .cal-day.today { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .cal-day.empty-day { padding: 10px 12px; }
  .cal-day-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; font-family: 'Nunito', sans-serif; }
  .cal-day.empty-day .cal-day-head { margin-bottom: 0; display: inline-flex; }
  .cd-name { font-weight: 800; }
  .cd-date { color: var(--muted); font-weight: 700; font-size: 0.9rem; }
  .cd-today { margin-left: auto; font-size: 0.75rem; font-weight: 800; color: #2E6B31; background: #EAF6EA; border-radius: 999px; padding: 1px 8px; }
  .cal-none { color: var(--muted); font-size: 0.85rem; }
  .cal-day.empty-day .cal-none { display: inline; margin-left: 8px; }

  .cal-entry { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .cal-entry + .cal-entry { border-top: 1px solid var(--border); padding-top: 8px; }

// Fails loudly instead of hanging forever, and logs each step
function step(label, promise) {
  console.log('[WW] start: ' + label);
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => {
      const err = new Error('Timed out at step: ' + label);
      err.code = 'ww/timeout';
      reject(err);
    }, STEP_TIMEOUT_MS);
  });
  return Promise.race([promise, timeout]).then(
    (v) => { clearTimeout(timer); console.log('[WW] done: ' + label); return v; },
    (e) => { clearTimeout(timer); console.error('[WW] failed: ' + label, e); throw e; }
  );
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const db = initializeFirestore(app, { experimentalForceLongPolling: true });

  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>'
};
const TABS = [
  { id: 'home', label: 'Home' },
  { id: 'library', label: 'Library' },
  { id: 'search', label: 'Search' },
  { id: 'profile', label: 'Profile' }
];

// ---------- State ----------
function savedTab() {
  try {
    const t = localStorage.getItem('ww_tab');
    return TABS.some(x => x.id === t) ? t : 'home';
  } catch (e) { return 'home'; }
}

function readEmailAction() {
  try {
    const q = new URLSearchParams(window.location.search);
    const mode = q.get('mode');
    const code = q.get('oobCode');
    if (code && (mode === 'verifyEmail' || mode === 'resetPassword')) return { mode: mode, code: code, state: 'checking', email: '', error: '', busy: false };
  } catch (e) { /* ignore */ }

}

const S = {
  emailAction: readEmailAction(), // verify / reset link opened from an email
  screen: 'loading',        // loading | auth | onboarding | app
  authMode: 'login',        // login | signup | reset
  authEmail: '',
  tab: savedTab(),
  user: null,
  profile: null,
  userDoc: null,
  personal: null,
  playlists: [],            // all playlists I'm a member of
  items: {},                // playlistId -> [items]
  busy: false,
  busyLabel: '',
  error: '',
  notice: '',
  search: { q: '', results: [], loading: false, error: '', done: false, reqId: 0 },
  detailCache: {},          // 'tv_123' -> details from Worker
  providerCatalog: null,    // full US provider list for My Services
  seasonCache: {},          // 'tmdbId_season' -> { episodes: [...] } or { loading } / { error }
  lib: loadLibFilter(),     // Library filters
  calFilter: loadCalFilter(), // playlist ids shown on the calendar; [] means all
  weekOffset: 0,            // 0 = this week
  tvm: {},                  // tvmazeId -> [{ s, e, name, airdate, airtime }]
  tvmLoading: {},           // tvmazeId -> true while fetching
  calError: '',
  linking: false,           // a TVmaze match batch is in flight
  invites: [],              // pending invites sent to me
  recs: { items: [], generatedAtMs: 0, loading: false, error: '', checked: false },
  profileCache: {},         // uid -> public profile (names for members)
  modal: null               // { view: 'detail' | 'add' | 'services', ... }
};

let unsubPlaylists = null;
let unsubItems = {};
let unsubPeople = null;
let unsubInvites = null;
let peopleSearchTimer = null;

const PL_COLORS = ['#4CAF50', '#7C3AED', '#2563EB', '#DB2777', '#EA580C', '#0D9488', '#CA8A04', '#475569'];

function loadLibFilter() {
  const def = { type: 'all', status: 'all', platform: 'all' };
  try {
    const v = JSON.parse(localStorage.getItem('ww_lib') || 'null');
    return v ? Object.assign(def, v) : def;
  } catch (e) { return def; }
}
function loadCalFilter() {
  try {
    const v = JSON.parse(localStorage.getItem('ww_cal') || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}
function saveCalFilter() {
  try { localStorage.setItem('ww_cal', JSON.stringify(S.calFilter)); } catch (e) { /* ignore */ }
}
function saveLibFilter() {
  try { localStorage.setItem('ww_lib', JSON.stringify(S.lib)); } catch (e) { /* ignore */ }
}

// ---------- Utils ----------
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function val(id) {
  const el = document.getElementById(id);
  return el ? el.value : '';
}
function itemKey(mediaType, tmdbId) {
  return mediaType + '_' + tmdbId;
}
function myServices() {
  return (S.userDoc && Array.isArray(S.userDoc.services)) ? S.userDoc.services : [];
}
function myServiceIds() {
  return myServices().map(s => String(s.id));
}
function fmtDate(iso) {
  if (!iso) return '';
  const parts = iso.split('-');
  const d = new Date(parseFloat(parts[0]), parseFloat(parts[1]) - 1, parseFloat(parts[2]));
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function msgHtml() {
  let h = '';
  if (S.error) h += '<div class="msg error" role="alert">' + esc(S.error) + '</div>';
  if (S.notice) h += '<div class="msg notice" role="status">' + esc(S.notice) + '</div>';
  return h;
}
function authErrorText(e) {
  const code = (e && e.code) || '';
  const map = {
    'auth/invalid-credential': 'That email and password don\'t match an account.',
    'auth/invalid-email': 'Enter a valid email address.',
    'auth/email-already-in-use': 'An account with that email already exists. Log in instead.',
    'auth/weak-password': 'Use a password with at least 6 characters.',
    'auth/missing-password': 'Enter your password.',
    'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.',
    'auth/network-request-failed': 'Network error. Check your connection and try again.'
  };
  return map[code] || (e && e.message) || 'Something went wrong.';
}

async function publicApi(action, data) {
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ action: action }, data || {}))
  });
  let body = {};
  try { body = await res.json(); } catch (e) { /* non-JSON */ }
  if (!res.ok) throw new Error(body.error || ('Request failed (' + res.status + ')'));
  return body;
}

// Branded emails go through the Worker and Resend; Firebase's plain emails are the fallback
async function sendVerificationEmail() {
  try {
    await api('sendVerification', {});
  } catch (e) {
    console.error('[WW] branded verification email failed, using Firebase', e);
    await sendEmailVerification(auth.currentUser, VERIFY_SETTINGS);
  }
}
async function sendResetEmail(email) {
  try {
    await publicApi('sendPasswordReset', { email: email });
  } catch (e) {
    console.error('[WW] branded reset email failed, using Firebase', e);
    await sendPasswordResetEmail(auth, email);
  }
}

async function api(action, data) {
  const user = auth.currentUser;
  if (!user) throw new Error('You are signed out.');
  const token = await user.getIdToken();
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(Object.assign({ action: action }, data || {}))
  });
  let body = {};
  try { body = await res.json(); } catch (e) { /* non-JSON */ }
  if (!res.ok) throw new Error(body.error || ('Request failed (' + res.status + ')'));
  return body;
}

// ---------- Data ----------
async function loadAccount() {
  const uid = S.user.uid;
  const [pSnap, uSnap] = await Promise.all([
    step('read profile', getDoc(doc(db, 'profiles', uid))),
    step('read user settings', getDoc(doc(db, 'users', uid)))
  ]);
  S.profile = pSnap.exists() ? pSnap.data() : null;
  S.userDoc = uSnap.exists() ? uSnap.data() : null;
  // Older profiles predate name search; add the lowercase name so others can find them
  if (S.profile && S.profile.displayName && !S.profile.displayNameLower) {
    S.profile.displayNameLower = S.profile.displayName.toLowerCase();
    setDoc(doc(db, 'profiles', uid), { displayNameLower: S.profile.displayNameLower }, { merge: true })
      .catch(e => console.error('[WW] name backfill failed', e));
  }
  S.personal = null;
  if (S.userDoc && S.userDoc.personalPlaylistId) {
    const plSnap = await step('read My List', getDoc(doc(db, 'playlists', S.userDoc.personalPlaylistId)));
    if (plSnap.exists()) S.personal = Object.assign({ id: plSnap.id }, plSnap.data());
  }
}

function startListeners() {
  stopListeners();
  const uid = S.user.uid;
  const q = query(collection(db, 'playlists'), where('memberUids', 'array-contains', uid));
  startInviteListener();
  unsubPlaylists = onSnapshot(q, (snap) => {
    const lists = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    lists.sort((a, b) => {
      if (a.isPersonal && !b.isPersonal) return -1;
      if (b.isPersonal && !a.isPersonal) return 1;
      return String(a.name).localeCompare(String(b.name));
    });
    S.playlists = lists;
    const ids = lists.map(l => l.id);
    // Subscribe to items of new playlists
    ids.forEach(pid => {
      if (unsubItems[pid]) return;
      unsubItems[pid] = onSnapshot(collection(db, 'playlists', pid, 'items'), (isnap) => {
        S.items[pid] = isnap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        onDataChange();
      }, (err) => console.error('[WW] items listener', pid, err));
    });
    // Unsubscribe from playlists I'm no longer in
    Object.keys(unsubItems).forEach(pid => {
      if (ids.indexOf(pid) === -1) {
        unsubItems[pid]();
        delete unsubItems[pid];
        delete S.items[pid];
      }
    });
    onDataChange();
  }, (err) => {
    console.error('[WW] playlists listener', err);
    S.error = 'Couldn\'t load your playlists: ' + err.message;
    onDataChange();
  });
}

function startInviteListener() {
  if (unsubInvites) unsubInvites();
  const q = query(collection(db, 'invites'), where('toUid', '==', S.user.uid), where('status', '==', 'pending'));
  unsubInvites = onSnapshot(q, (snap) => {
    S.invites = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    onDataChange();
  }, (err) => console.error('[WW] invites listener', err));
}

function stopListeners() {
  if (unsubInvites) { unsubInvites(); unsubInvites = null; }
  S.invites = [];
  if (unsubPlaylists) { unsubPlaylists(); unsubPlaylists = null; }
  Object.keys(unsubItems).forEach(pid => unsubItems[pid]());
  unsubItems = {};
  S.playlists = [];
  S.items = {};
}

function onDataChange() {
  if (S.screen !== 'app') return;
  ensureTvmazeLinks();
  ensureSchedule();
  maybeLoadRecs();
  render();
  // Refresh the detail view (membership or progress may have changed); the add form is never re-rendered mid-edit
  if (S.modal && S.modal.view === 'detail') {
    ensureCtx();
    renderModal();
  }
  if (S.modal && S.modal.view === 'playlist') {
    // The list was deleted, or I was removed from it
    const found = S.playlists.some(p => p.id === S.modal.pid);
    if (found) S.modal.seen = true;
    else if (S.modal.seen) { S.modal = null; renderModal(); return; }
    loadMemberProfiles(S.modal.pid);
    renderModal();
  }
}

// Picks which playlist's copy of this title the detail sheet tracks, and listens to its notes
function ensureCtx() {
  const m = S.modal;
  if (!m || !m.key) return;
  const mem = memberships(m.key);
  if (!mem.length) {
    m.ctxPid = null;
    stopPeople();
    m.people = {};
    return;
  }
  if (!m.ctxPid || !mem.some(x => x.playlist.id === m.ctxPid)) {
    const preferred = m.preferPid && mem.find(x => x.playlist.id === m.preferPid);
    m.ctxPid = (preferred || mem[0]).playlist.id;
  }
  if (m.peopleFor !== m.ctxPid) startPeople(m.ctxPid, m.key);
  initSeason();
}

function startPeople(pid, key) {
  stopPeople();
  const m = S.modal;
  m.peopleFor = pid;
  m.people = {};
  unsubPeople = onSnapshot(collection(db, 'playlists', pid, 'items', key, 'people'), (snap) => {
    if (!S.modal || S.modal.key !== key || S.modal.peopleFor !== pid) return;
    const people = {};
    snap.docs.forEach(d => { people[d.id] = d.data(); });
    S.modal.people = people;
    if (S.modal.view === 'detail') renderModal();
  }, (err) => console.error('[WW] people listener', err));
}

function stopPeople() {
  if (unsubPeople) { unsubPeople(); unsubPeople = null; }
  if (S.modal) S.modal.peopleFor = null;
}

// Chooses the starting season (where "up next" is) and loads the episodes needed on screen
function initSeason() {
  const m = S.modal;
  const d = m && m.data;
  if (!d || d.mediaType !== 'tv' || !(d.seasonList || []).length) return;
  const item = ctxItem();
  if (!m.season) {
    const nk = item ? nextUpKey(item) : null;
    const pk = item ? previousKey(item) : null;
    const anchor = parseEpKey(nk || pk);
    m.season = anchor ? anchor.s : d.seasonList[0].number;
  }
  loadSeason(d.tmdbId, m.season);
  if (item) {
    [nextUpKey(item), previousKey(item)].forEach(k => {
      const p = parseEpKey(k);
      if (p) loadSeason(d.tmdbId, p.s);
    });
  }
}

// Keeps stored show metadata (episode counts, latest aired) current so progress stays accurate
function refreshStoredItems(d) {
  memberships(itemKey(d.mediaType, d.tmdbId)).forEach(x => {
    const it = x.item;
    const fields = { title: d.title, posterPath: d.posterPath || null };
    if (d.mediaType === 'tv') Object.assign(fields, tvMeta(d));
    else fields.releases = d.releases || null;
    const changed = Object.keys(fields).some(k => JSON.stringify(it[k] == null ? null : it[k]) !== JSON.stringify(fields[k]));
    if (!changed) return;
    fields.lastRefreshed = serverTimestamp();
    setDoc(doc(db, 'playlists', x.playlist.id, 'items', it.id), fields, { merge: true })
      .catch(e => console.error('[WW] refresh item failed', e));
  });
}

function tvMeta(d) {
  const counts = {};
  (d.seasonList || []).forEach(se => { counts[String(se.number)] = se.episodeCount; });
  return {
    seasonCounts: counts,
    lastAired: d.lastAired ? { s: d.lastAired.s, e: d.lastAired.e } : null,
    nextAir: d.nextAir || null,
    showStatus: d.status || ''
  };
}

// Where is this title? -> [{ playlist, item }]
function memberships(key) {
  const out = [];
  S.playlists.forEach(pl => {
    const it = (S.items[pl.id] || []).find(i => i.id === key);
    if (it) out.push({ playlist: pl, item: it });
  });
  return out;
}

// ---------- Episode progress helpers ----------
function epKey(s, e) {
  return 's' + s + 'e' + e;
}
function parseEpKey(k) {
  const m = /^s(\d+)e(\d+)$/.exec(k || '');
  return m ? { s: parseFloat(m[1]), e: parseFloat(m[2]) } : null;
}
function epLabel(k) {
  const p = parseEpKey(k);
  return p ? 'S' + p.s + ' E' + p.e : '';
}
function todayIso() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Every aired episode key, in order, based on the item's stored season counts
function airedKeys(item) {
  const out = [];
  if (!item || !item.seasonCounts || !item.lastAired) return out;
  const la = item.lastAired;
  Object.keys(item.seasonCounts).map(x => parseFloat(x)).sort((a, b) => a - b).forEach(sn => {
    if (sn > la.s) return;
    const count = sn === la.s ? la.e : parseFloat(item.seasonCounts[sn]) || 0;
    for (let e = 1; e <= count; e++) out.push(epKey(sn, e));
  });
  return out;
}
function isWatched(item, k) {
  return !!(item && item.watched && item.watched[k]);
}
function progressOf(item) {
  const keys = airedKeys(item);
  const watched = keys.filter(k => isWatched(item, k)).length;
  return { watched: watched, aired: keys.length };
}
function nextUpKey(item) {
  return airedKeys(item).find(k => !isWatched(item, k)) || null;
}
// The episode to recap: the one right before "up next", or the latest if caught up
function previousKey(item) {
  const keys = airedKeys(item);
  const next = nextUpKey(item);
  const idx = next ? keys.indexOf(next) : keys.length;
  const k = idx > 0 ? keys[idx - 1] : null;
  return k && isWatched(item, k) ? k : null;
}
function seasonCacheKey(tmdbId, sn) {
  return tmdbId + '_' + sn;
}
function findEpisode(tmdbId, k) {
  const p = parseEpKey(k);
  if (!p) return null;
  const c = S.seasonCache[seasonCacheKey(tmdbId, p.s)];
  return (c && c.episodes) ? (c.episodes.find(x => x.e === p.e) || null) : null;
}
async function loadSeason(tmdbId, sn) {
  const ck = seasonCacheKey(tmdbId, sn);
  if (S.seasonCache[ck] && !S.seasonCache[ck].error) return;
  S.seasonCache[ck] = { loading: true };
  try {
    const d = await api('season', { tmdbId: tmdbId, season: sn });
    S.seasonCache[ck] = { episodes: d.episodes || [] };
  } catch (e) {
    S.seasonCache[ck] = { error: e.message };
  }
  if (S.modal && S.modal.view === 'detail' && S.modal.tmdbId === tmdbId) renderModal();
}

// ---------- Calendar data ----------
function isoOf(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isoAddDays(iso, n) {
  const p = iso.split('-');
  const d = new Date(parseFloat(p[0]), parseFloat(p[1]) - 1, parseFloat(p[2]) + n);
  return isoOf(d);
}
function weekStartIso() {
  const t = new Date();
  const start = new Date(t.getFullYear(), t.getMonth(), t.getDate() - t.getDay() + S.weekOffset * 7);
  return isoOf(start);
}
function isoToDate(iso) {
  const p = iso.split('-');
  return new Date(parseFloat(p[0]), parseFloat(p[1]) - 1, parseFloat(p[2]));
}

function allItemsWithPlaylist() {
  const out = [];
  S.playlists.forEach(pl => (S.items[pl.id] || []).forEach(it => out.push({ pl: pl, it: it })));
  return out;
}

// Match TV shows to TVmaze once; the result is stored on the item
async function ensureTvmazeLinks() {
  if (S.linking) return;
  const pending = {};
  allItemsWithPlaylist().forEach(x => {
    const it = x.it;
    if (it.mediaType !== 'tv' || it.tvmazeChecked) return;
    if (!pending[it.id]) pending[it.id] = { key: it.id, imdbId: it.imdbId || null, tvdbId: it.tvdbId || null, title: it.title, refs: [] };
    pending[it.id].refs.push(x.pl.id);
  });
  const batch = Object.keys(pending).slice(0, 25).map(k => pending[k]);
  if (!batch.length) return;
  S.linking = true;
  try {
    const res = await api('linkTvmaze', { shows: batch.map(b => ({ key: b.key, imdbId: b.imdbId, tvdbId: b.tvdbId, title: b.title })) });
    const results = res.results || {};
    await Promise.all(batch.map(b => {
      const r = results[b.key] || null;
      const fields = { tvmazeId: r ? r.id : null, tvmaze: r, tvmazeChecked: true };
      return Promise.all(b.refs.map(pid => setDoc(doc(db, 'playlists', pid, 'items', b.key), fields, { merge: true })));
    }));
  } catch (e) {
    console.error('[WW] TVmaze linking failed', e);
    S.calError = 'Couldn\'t match shows to their schedules: ' + e.message;
  }
  S.linking = false;
}

// Load episode air dates for every linked show (all playlists, so filter changes are instant)
async function ensureSchedule() {
  const ids = [];
  allItemsWithPlaylist().forEach(x => {
    const id = x.it.tvmazeId;
    if (x.it.mediaType === 'tv' && id && !S.tvm[id] && !S.tvmLoading[id] && ids.indexOf(id) === -1) ids.push(id);
  });
  if (!ids.length) return;
  ids.forEach(id => { S.tvmLoading[id] = true; });
  try {
    const res = await api('episodes', { ids: ids });
    const shows = res.shows || {};
    ids.forEach(id => { S.tvm[id] = shows[String(id)] || []; });
    S.calError = '';
  } catch (e) {
    console.error('[WW] schedule load failed', e);
    S.calError = 'Couldn\'t load air dates: ' + e.message;
  }
  ids.forEach(id => { delete S.tvmLoading[id]; });
  if (S.screen === 'app' && S.tab === 'home') render();
}

function calPlaylists() {
  const sel = S.calFilter.filter(pid => S.playlists.some(p => p.id === pid));
  return sel.length ? S.playlists.filter(p => sel.indexOf(p.id) !== -1) : S.playlists;
}

// Builds { iso: [entry] } for the 7 days starting at startIso
function calendarEntries(startIso) {
  const days = [];
  for (let i = 0; i < 7; i++) days.push(isoAddDays(startIso, i));
  const endIso = days[6];
  const today = todayIso();
  const byKey = {};
  const order = [];

  function add(entry, pl) {
    const k = entry.id;
    if (!byKey[k]) { byKey[k] = entry; entry.pls = []; order.push(k); }
    byKey[k].pls.push({ pid: pl.id, name: pl.name, color: pl.color || '#4CAF50' });
  }

  calPlaylists().forEach(pl => (S.items[pl.id] || []).forEach(it => {
    if (it.hideFromCalendar || it.status === 'dropped') return;
    if (it.mediaType === 'tv') {
      const eps = it.tvmazeId ? S.tvm[it.tvmazeId] : null;
      if (!eps) return;
      const offset = parseFloat(it.dayOffset) || 0;
      eps.forEach(ep => {
        const date = isoAddDays(ep.airdate, offset);
        if (date < startIso || date > endIso) return;
        const k = epKey(ep.s, ep.e);
        add({
          id: it.id + '|' + k + '|' + date, date: date, kind: 'ep', itemId: it.id,
          mediaType: 'tv', tmdbId: it.tmdbId, title: it.title, posterPath: it.posterPath,
          label: 'S' + ep.s + ' E' + ep.e + (ep.name ? ': ' + ep.name : ''),
          platform: it.platform ? it.platform.name : (it.tvmaze && (it.tvmaze.webChannel || it.tvmaze.network)) || '',
          epKey: k, aired: ep.airdate <= today, watched: isWatched(it, k)
        }, pl);
      });
    } else if (it.status === 'want' && it.releases) {
      [['theatrical', 'In theaters'], ['digital', 'Digital release']].forEach(r => {
        const date = it.releases[r[0]];
        if (!date || date < startIso || date > endIso) return;
        add({
          id: it.id + '|' + r[0] + '|' + date, date: date, kind: 'movie', itemId: it.id,
          mediaType: 'movie', tmdbId: it.tmdbId, title: it.title, posterPath: it.posterPath,
          label: r[1], platform: it.platform ? it.platform.name : '', aired: date <= today, watched: false
        }, pl);
      });
    }
  }));

  const out = {};
  days.forEach(d => { out[d] = []; });
  order.forEach(k => out[byKey[k].date].push(byKey[k]));
  days.forEach(d => out[d].sort((a, b) => String(a.title).localeCompare(String(b.title))));
  return out;
}

function continueWatching() {
  const seen = {};
  const out = [];
  calPlaylists().forEach(pl => (S.items[pl.id] || []).forEach(it => {
    if (it.mediaType !== 'tv' || it.status !== 'watching' || seen[it.id]) return;
    const next = nextUpKey(it);
    if (!next) return;
    seen[it.id] = true;
    out.push({ it: it, pid: pl.id, next: next });
  }));
  const ms = x => (x.it.updatedAt && x.it.updatedAt.toMillis) ? x.it.updatedAt.toMillis() : 0;
  return out.sort((a, b) => ms(b) - ms(a)).slice(0, 12);
}

function peopleResultsHtml() {
  const m = S.modal;

  if (!pl) return '';
  if (m.searching) return '<p class="muted small">Searching…</p>';

  let h = '<div class="people">';
  m.results.forEach(p => {
    const isMember = (pl.memberUids || []).indexOf(p.uid) !== -1;

  });

  return h;
}

function viewPlaylistModal() {
  const m = S.modal;
  const pl = S.playlists.find(p => p.id === m.pid);

  const me = S.user.uid;

  let h = sheetTop('List settings', false);

  h += '<div class="field"><label for="plName">Name</label>';
  h += '<input class="input" id="plName" maxlength="40" value="' + esc(m.form.name) + '" oninput="setPlaylistName(this.value)"></div>';

    h += '<div class="section"><p class="muted small" style="margin:0">My List is just for you. To watch with someone, create a new list and invite them.</p></div>';
    return h;
  }

  // Members

    const p = S.profileCache[uid];
    h += '<div class="person"><div><div class="p-name">' + esc(memberName(uid)) + (uid === me ? ' <span class="muted small">(you)</span>' : '') + '</div>';
    h += '<div class="small muted">' + (p && p.username ? '@' + esc(p.username) : '') + (uid === pl.ownerUid ? (p && p.username ? ', owner' : 'Owner') : '') + '</div></div>';
    if (isOwner && uid !== me) h += '<button class="remove-btn" style="margin:0" onclick="removeMember(\'' + esc(uid) + '\')">Remove</button>';
    h += '</div>';
  });
  h += '</div></div>';

  // Invite
  h += '<div class="section"><h3>Invite people</h3>';
  h += '<input class="input" id="peopleSearch" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Search by name or username" value="' + esc(m.q || '') + '" oninput="searchPeople(this.value)">';
  h += '<div id="peopleResults" style="margin-top:10px">' + peopleResultsHtml() + '</div>';
  const others = (m.sent || []).filter(x => x.playlistId === pl.id && (pl.memberUids || []).indexOf(x.toUid) === -1);
  if (others.length) {
    h += '<div class="small muted" style="margin:14px 0 6px;font-weight:700">Invites you\'ve sent</div><div class="people">';
    others.forEach(x => {
      h += '<div class="person"><div><div class="p-name">' + esc(x.toName || 'Someone') + '</div><div class="small muted">' + (x.toUsername ? '@' + esc(x.toUsername) : '') + '</div></div>';
      h += x.status === 'pending'
        ? '<span class="small muted">Waiting</span>'
        : '<button class="btn secondary small" onclick="sendInvite(\'' + esc(x.toUid) + '\')">Invite again</button>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  // Leave / delete
  h += '<div class="section">';
  h += isOwner
    ? '<button class="remove-btn" onclick="deleteList()">Delete this list</button><div class="hint">Removes the list and its titles for everyone.</div>'
    : '<button class="remove-btn" onclick="leaveList()">Leave this list</button><div class="hint">You can rejoin if someone invites you again.</div>';
  h += '</div>';
  return h;
}

// ---------- Recommendations ----------
const RECS_MAX_AGE_MS = 7 * 24 * 3600 * 1000;

function allItemsLoaded() {
  return S.playlists.length > 0 && S.playlists.every(pl => Array.isArray(S.items[pl.id]));
}

function trackedKeys() {
  const keys = {};
  allItemsWithPlaylist().forEach(x => { keys[x.it.id] = true; });
  return keys;
}

// Runs once per session: use saved picks if fresh, otherwise make new ones
async function maybeLoadRecs() {
  if (S.recs.checked || !allItemsLoaded()) return;
  S.recs.checked = true;
  if (!allItemsWithPlaylist().length) return;
  try {
    const snap = await getDoc(doc(db, 'users', S.user.uid, 'recs', 'current'));
    if (snap.exists()) {
      const d = snap.data();
      S.recs.items = d.items || [];
      S.recs.generatedAtMs = d.generatedAtMs || 0;
    }
  } catch (e) { console.error('[WW] recs load failed', e); }
  if (!S.recs.items.length || Date.now() - S.recs.generatedAtMs > RECS_MAX_AGE_MS) {
    generateRecs();
  } else if (S.tab === 'home') {
    render();
  }
}

async function buildTasteProfile() {
  // One entry per title; your rating is the highest you've given it in any list
  const byKey = {};
  allItemsWithPlaylist().forEach(x => {
    const it = x.it;
    if (!byKey[it.id]) byKey[it.id] = { key: it.id, tmdbId: it.tmdbId, mediaType: it.mediaType, title: it.title, status: it.status, rating: null, refs: [] };
    byKey[it.id].refs.push(x.pl.id);
  });
  const list = Object.keys(byKey).map(k => byKey[k]).slice(0, 60);
  await Promise.all(list.map(async entry => {
    for (const pid of entry.refs) {
      try {
        const snap = await getDoc(doc(db, 'playlists', pid, 'items', entry.key, 'people', S.user.uid));
        const r = snap.exists() && snap.data().show ? parseFloat(snap.data().show.rating) : NaN;
        if (!isNaN(r) && (entry.rating == null || r > entry.rating)) entry.rating = r;
      } catch (e) { /* no rating here */ }
    }
  }));
  return list.map(e => ({ key: e.key, tmdbId: e.tmdbId, mediaType: e.mediaType, title: e.title, status: e.status, rating: e.rating }));
}

async function generateRecs() {
  if (S.recs.loading) return;
  S.recs.loading = true;
  S.recs.error = '';
  if (S.tab === 'home') render();
  try {
    const profile = await buildTasteProfile();
    const dismissed = (S.userDoc && S.userDoc.dismissedRecs) || [];
    const res = await api('recommend', {
      profile: profile,
      exclude: Object.keys(trackedKeys()).concat(dismissed),
      services: myServiceIds()
    });
    const items = res.picks || [];
    const now = Date.now();
    await setDoc(doc(db, 'users', S.user.uid, 'recs', 'current'), {
      items: items, generatedAtMs: now, generatedAt: serverTimestamp()
    }, { merge: true });
    S.recs.items = items;
    S.recs.generatedAtMs = now;
  } catch (e) {
    console.error('[WW] recs failed', e);
    S.recs.error = e.message;
  }
  S.recs.loading = false;
  if (S.tab === 'home') render();
}

function visibleRecs() {
  const tracked = trackedKeys();
  const dismissed = (S.userDoc && S.userDoc.dismissedRecs) || [];
  return S.recs.items.filter(r => !tracked[r.key] && dismissed.indexOf(r.key) === -1);
}

function recsHtml() {
  if (!allItemsWithPlaylist().length) return '';
  const list = visibleRecs();
  let h = '<div class="section-head row-between"><h2>Recommended for you</h2>';
  h += '<button class="link-btn" onclick="refreshRecs()"' + (S.recs.loading ? ' disabled' : '') + '>' + (S.recs.loading ? 'Finding picks…' : 'Refresh') + '</button></div>';
  if (S.recs.error && !list.length) {
    return h + '<div class="card empty"><p class="muted">Couldn\'t get recommendations: ' + esc(S.recs.error) + '</p><button class="btn secondary small" onclick="refreshRecs()">Try again</button></div>';
  }
  if (!list.length) {
    return h + '<div class="card empty"><p class="muted">' + (S.recs.loading
      ? 'Looking at what you\'ve watched and rated…'
      : 'Rate a few shows and movies, then tap Refresh for picks based on your taste.') + '</p></div>';
  }
  h += '<div class="rail recs">';
  list.forEach(r => {
    h += '<div class="rec-tile">';
    h += '<button type="button" class="rec-dismiss" aria-label="Not interested in ' + esc(r.title) + '" onclick="dismissRec(\'' + esc(r.key) + '\')">' + ICONS.close + '</button>';
    h += '<button type="button" class="rail-tile" onclick="openDetail(\'' + r.mediaType + '\',' + parseFloat(r.tmdbId) + ')">';
    h += posterHtml(r.posterPath, r.title, false);
    h += '<span class="rail-title">' + esc(r.title) + '</span>';
    h += '<span class="rec-reason">Recommended ' + esc(String(r.reason || '').replace(/^Because/, 'because')) + '</span>';
    if (r.onServices && r.onServices.length) h += '<span class="rec-avail">On ' + esc(r.onServices[0]) + '</span>';
    h += '</button></div>';
  });
  h += '</div>';
  return h;
}

window.refreshRecs = function () {
  generateRecs();
};

window.dismissRec = async function (key) {
  const dismissed = ((S.userDoc && S.userDoc.dismissedRecs) || []).concat([key]);
  S.userDoc = Object.assign({}, S.userDoc || {}, { dismissedRecs: dismissed });
  render();
  try {
    await setDoc(doc(db, 'users', S.user.uid), { dismissedRecs: arrayUnion(key) }, { merge: true });
  } catch (e) { console.error('[WW] dismiss failed', e); }
};

  } else if (a.state === 'error') {
    h += '<h2>' + (a.mode === 'verifyEmail' ? 'Couldn\'t verify your email' : 'Couldn\'t reset your password') + '</h2>';
    h += '<div class="msg error" role="alert">' + esc(a.error) + '</div>';
    h += '<button class="btn block" onclick="finishEmailAction()">Go to WellWatched</button>';
  } else if (a.mode === 'verifyEmail') {
    h += '<h2>Email verified</h2><p class="muted">Thanks for confirming your email.</p>';
    h += '<button class="btn block" onclick="finishEmailAction()">Continue to WellWatched</button>';
  } else if (a.state === 'form') {
    h += '<h2>Choose a new password</h2><p class="muted small">For ' + esc(a.email) + '</p>';
    if (a.error) h += '<div class="msg error" role="alert">' + esc(a.error) + '</div>';
    h += '<form onsubmit="event.preventDefault(); submitNewPassword();">';
    h += '<input type="email" autocomplete="username" value="' + esc(a.email) + '" hidden>';
    h += '<div class="field"><label for="newPw">New password</label>';
    h += '<input class="input" id="newPw" type="password" autocomplete="new-password" required minlength="6">';
    h += '<div class="hint">At least 6 characters.</div></div>';
    h += '<div class="field"><label for="newPw2">Confirm new password</label>';
    h += '<input class="input" id="newPw2" type="password" autocomplete="new-password" required minlength="6"></div>';
    h += '<button class="btn block" type="submit"' + (a.busy ? ' disabled' : '') + '>' + (a.busy ? 'Saving…' : 'Save new password') + '</button>';
    h += '</form>';
  } else {
    h += '<h2>Password changed</h2><p class="muted">You can log in with your new password now.</p>';
    h += '<button class="btn block" onclick="finishEmailAction()">Log in</button>';
  }
  h += '</div></div></div>';
  return h;
}

function actionErrorText(e) {
  const code = (e && e.code) || '';
  if (code === 'auth/expired-action-code') return 'This link has expired. Request a new one from WellWatched.';
  if (code === 'auth/invalid-action-code') return 'This link has already been used or isn\'t valid. Request a new one from WellWatched.';
  if (code === 'auth/user-disabled') return 'This account has been disabled.';
  if (code === 'auth/user-not-found') return 'There\'s no account for this link anymore.';
  return (e && e.message) || 'Something went wrong.';
}

async function startEmailAction() {
  const a = S.emailAction;
  try {
    if (a.mode === 'verifyEmail') {
      await applyActionCode(auth, a.code);
      a.state = 'done';
      if (auth.currentUser) {
        await auth.currentUser.reload();
        await auth.currentUser.getIdToken(true);
        S.user = auth.currentUser;
      }
    } else {
      a.email = await verifyPasswordResetCode(auth, a.code);
      a.state = 'form';
    }
  } catch (e) {
    a.state = 'error';
    a.error = actionErrorText(e);
  }
  render();
}

window.submitNewPassword = async function () {
  const a = S.emailAction;
  const pw = val('newPw');
  const pw2 = val('newPw2');
  if (pw.length < 6) { a.error = 'Use at least 6 characters.'; render(); return; }
  if (pw !== pw2) { a.error = 'The passwords don\'t match.'; render(); return; }
  a.busy = true;
  a.error = '';
  render();
  try {
    await confirmPasswordReset(auth, a.code, pw);
    a.state = 'done';
    S.authEmail = a.email;
    S.authMode = 'login';
  } catch (e) {
    a.error = actionErrorText(e);
  }
  a.busy = false;
  render();
};

window.finishEmailAction = function () {
  S.emailAction = null;
  try { history.replaceState(null, '', window.location.pathname); } catch (e) { /* ignore */ }
  if (!S.user) S.screen = 'auth';
  render();
};

function viewHome() {
  const name = S.profile ? S.profile.displayName : '';
  const start = weekStartIso();
  const end = isoAddDays(start, 6);
  const today = todayIso();
  const entries = calendarEntries(start);
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const totalItems = Object.keys(S.items).reduce((n, pid) => n + (S.items[pid] || []).length, 0);
  const loading = S.linking || Object.keys(S.tvmLoading).length > 0;

  let h = '<div class="page-head"><h1>Hi, ' + esc(name) + '</h1></div>';
  h += msgHtml();
  h += invitesHtml();

  const sd = isoToDate(start), ed = isoToDate(end);
  const range = sd.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' to ' +
    ed.toLocaleDateString(undefined, { month: sd.getMonth() === ed.getMonth() ? undefined : 'short', day: 'numeric' });
  h += '<div class="week-nav">';
  h += '<button class="icon-btn" aria-label="Previous week" onclick="setWeek(-1)"' + (S.weekOffset <= -12 ? ' disabled' : '') + '>' + ICONS.back + '</button>';
  h += '<div class="week-title"><h2>' + (S.weekOffset === 0 ? 'This week' : esc(range)) + '</h2>';
  h += '<div class="small muted">' + (S.weekOffset === 0 ? esc(range) : '<button class="link-btn" onclick="setWeek(0)">Back to this week</button>') + '</div></div>';
  h += '<button class="icon-btn flip" aria-label="Next week" onclick="setWeek(1)"' + (S.weekOffset >= 25 ? ' disabled' : '') + '>' + ICONS.back + '</button>';
  h += '</div>';

  h += calChipsHtml();
  if (S.calError) h += '<div class="msg error" role="alert">' + esc(S.calError) + '</div>';

  // Mobile day strip: tap to jump to that day
  h += '<div class="week">';
  for (let i = 0; i < 7; i++) {
    const iso = isoAddDays(start, i);
    const n = entries[iso].length;
    h += '<button type="button" class="day' + (iso === today ? ' today' : '') + '" onclick="jumpToDay(\'' + iso + '\')">';
    h += '<div class="dname">' + dayNames[i] + '</div><div class="dnum">' + isoToDate(iso).getDate() + '</div>';
    h += '<div class="dcount">' + (n ? '<span class="dot sm"></span>'.repeat(Math.min(n, 3)) : '') + '</div></button>';
  }
  h += '</div>';

  if (!totalItems) {
    h += '<div class="card empty"><h3>Nothing on your calendar yet</h3>';
    h += '<p class="muted">Add a show you\'re watching and its new episodes will show up here on the day they drop.</p>';
    h += '<button class="btn" onclick="setTab(\'search\')">Find a show</button></div>';
    return h;
  }

  h += '<div class="cal">';
  for (let i = 0; i < 7; i++) {
    const iso = isoAddDays(start, i);
    const d = isoToDate(iso);
    const list = entries[iso];
    h += '<section class="cal-day' + (iso === today ? ' today' : '') + (list.length ? '' : ' empty-day') + '" id="day-' + iso + '">';
    h += '<div class="cal-day-head"><span class="cd-name">' + dayNames[i] + '</span><span class="cd-date">' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + '</span>' + (iso === today ? '<span class="cd-today">Today</span>' : '') + '</div>';
    if (list.length) list.forEach(en => { h += calEntryHtml(en); });
    else h += '<div class="cal-none">' + (loading ? 'Loading…' : 'Nothing new') + '</div>';
    h += '</section>';
  }
  h += '</div>';

  h += continueHtml();
  h += recsHtml();
  return h;
}

function libStatusOptions() {
  const t = S.lib.type;
  if (t === 'tv') return STATUS.tv;
  if (t === 'movie') return STATUS.movie;
  // Union, in display order
  const all = STATUS.tv.concat(STATUS.movie);
  const seen = {};
  return STATUS_ORDER.map(id => all.find(x => x.id === id)).filter(x => x && !seen[x.id] && (seen[x.id] = true));
}

function libPlatformOptions() {
  const byId = {};
  let hasNone = false;
  Object.keys(S.items).forEach(pid => (S.items[pid] || []).forEach(it => {
    if (it.platform && it.platform.id != null) byId[String(it.platform.id)] = it.platform.name;
    else hasNone = true;
  }));
  const out = Object.keys(byId).map(id => ({ id: id, name: byId[id] }))
    .sort((a, b) => a.name.localeCompare(b.name));
  if (hasNone) out.push({ id: 'none', name: 'Not set' });
  return out;
}

function passesLibFilter(it) {
  const f = S.lib;
  if (f.type !== 'all' && it.mediaType !== f.type) return false;
  if (f.status !== 'all' && it.status !== f.status) return false;
  if (f.platform !== 'all') {
    const pid = it.platform && it.platform.id != null ? String(it.platform.id) : 'none';
    if (pid !== f.platform) return false;
  }
  return true;
}

function libraryFiltersHtml() {
  const f = S.lib;
  let h = '<div class="lib-filters">';
  h += '<div class="seg" role="group" aria-label="Type">';
  [['all', 'All'], ['tv', 'TV'], ['movie', 'Movies']].forEach(o => {
    h += '<button type="button" class="' + (f.type === o[0] ? 'on' : '') + '" aria-pressed="' + (f.type === o[0]) + '" onclick="setLibFilter(\'type\', \'' + o[0] + '\')">' + o[1] + '</button>';

  h += '<select class="input" aria-label="Status" onchange="setLibFilter(\'status\', this.value)">';
  h += '<option value="all">All statuses</option>';

    h += '<option value="' + o.id + '"' + (f.status === o.id ? ' selected' : '') + '>' + esc(o.label) + '</option>';
  });
  h += '</select>';
  h += '<select class="input" aria-label="Platform" onchange="setLibFilter(\'platform\', this.value)">';
  h += '<option value="all">All platforms</option>';

  return h;
}

function libraryTileHtml(it, pid) {
  let h = '<button type="button" class="tile" onclick="openDetail(\'' + it.mediaType + '\',' + parseFloat(it.tmdbId) + ',\'' + pid + '\')">';
  h += posterHtml(it.posterPath, it.title, false);
  h += '<h3 style="font-size:0.95rem;margin-top:8px;line-height:1.3">' + esc(it.title) + '</h3>';
  h += '<div class="meta small"><span class="status ' + esc(it.status) + '">' + esc(statusLabel(it.mediaType, it.status)) + '</span>';
  if (it.platform && it.platform.name) h += ' <span class="muted">' + esc(it.platform.name) + '</span>';
  h += '</div>';
  if (it.mediaType === 'tv') {
    const pr = progressOf(it);
    if (pr.aired) {
      const pct = Math.round((pr.watched / pr.aired) * 100);
      h += '<div class="progress" aria-hidden="true"><span style="width:' + pct + '%"></span></div>';
      h += '<div class="meta small muted">' + (pr.watched >= pr.aired ? 'Caught up' : pr.watched + ' of ' + pr.aired + ' episodes') + '</div>';
    }
  } else if (Array.isArray(it.watchDates) && it.watchDates.length) {
    h += '<div class="meta small muted">Watched ' + it.watchDates.length + (it.watchDates.length === 1 ? ' time' : ' times') + '</div>';
  }
  h += '</button>';
  return h;
}

function viewLibrary() {
  let h = '<div class="page-head row-between"><h1>Library</h1><button class="btn small" onclick="openNewList()">New list</button></div>';
  h += msgHtml();
  h += invitesHtml();
  if (!S.playlists.length) {
    h += '<div class="loading" style="min-height:160px"><div class="spinner" aria-label="Loading"></div></div>';
    return h;
  }
  h += libraryFiltersHtml();
  const filtering = S.lib.type !== 'all' || S.lib.status !== 'all' || S.lib.platform !== 'all';
  S.playlists.forEach(pl => {
    const all = S.items[pl.id] || [];
    const items = all.filter(passesLibFilter).sort((a, b) => {
      const sa = STATUS_ORDER.indexOf(a.status), sb = STATUS_ORDER.indexOf(b.status);
      if (sa !== sb) return sa - sb;
      return String(a.title).localeCompare(String(b.title));
    });
    h += '<div class="pl-head"><span class="dot" style="background:' + esc(pl.color || '#4CAF50') + '"></span>';
    h += '<h2>' + esc(pl.name) + '</h2><span class="count">';
    h += filtering ? items.length + ' of ' + all.length : all.length + (all.length === 1 ? ' title' : ' titles');
    const n = (pl.memberUids || []).length;
    if (!pl.isPersonal) h += ', ' + (n === 1 ? 'just you' : n + ' people');
    h += '</span><button class="link-btn pl-manage" onclick="openPlaylist(\'' + pl.id + '\')">Settings</button></div>';
    if (!all.length) {
      h += '<div class="card empty"><p class="muted">Nothing here yet. Search for a show or movie and add it to this list.</p>';
      h += '<button class="btn" onclick="setTab(\'search\')">Search</button></div>';
      return;
    }
    if (!items.length) {
      h += '<div class="card empty"><p class="muted">No titles in ' + esc(pl.name) + ' match these filters.</p>';
      h += '<button class="btn secondary" onclick="clearLibFilters()">Clear filters</button></div>';
      return;
    }
    h += '<div class="results">';
    items.forEach(it => { h += libraryTileHtml(it, pl.id); });
    h += '</div>';
  });
  return h;
}

function viewSearch() {
